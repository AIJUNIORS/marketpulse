*{box-sizing:border-box;margin:0;padding:0}body.d{background:#f0f2f5;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:13px}.topbar{background:#111827;padding:0 16px;display:flex;align-items:stretch;justify-content:space-between;min-height:46px}.logo{font-size:15px;font-weight:900;color:#fff;letter-spacing:-.5px;display:flex;align-items:center;min-width:110px}.logo em{color:#60a5fa;font-style:normal}.mkt-strip{display:flex;align-items:stretch;overflow-x:auto;flex:1;margin:0 12px}.ms{padding:0 10px;border-left:1px solid #1e293b;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center;min-width:92px;transition:background .12s}.ms:hover,.ms.on{background:#1e293b}.ms-n{font-size:8px;color:#64748b;text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin-bottom:1px}.ms-p{font-size:11px;font-weight:900;font-family:'Courier New',monospace;color:#e2e8f0;letter-spacing:-.3px}.ms-v{font-size:10px;font-weight:800;font-family:'Courier New',monospace}.ms-v.p{color:#4ade80}.ms-v.n{color:#f87171}.ms-v.z{color:#cbd5e1}.upd{font-size:10px;color:#9ca3af;background:#1f2937;padding:4px 9px;border-radius:4px;font-family:'Courier New',monospace;align-self:center;white-space:nowrap}.modetabs{display:flex;gap:0;background:#111827;padding:0 16px;border-bottom:1px solid #1f2937;overflow-x:auto}.mt{padding:9px 18px;font-size:11px;font-weight:800;cursor:pointer;color:#6b7280;border-bottom:3px solid transparent;transition:all .15s;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}.mt.on{color:#60a5fa;border-bottom-color:#60a5fa}.mt:hover:not(.on){color:#d1d5db}.atabs{display:flex;gap:2px;padding:0 16px;background:#1f2937;flex-wrap:wrap}.at{padding:8px 13px;font-size:11px;font-weight:700;cursor:pointer;color:#9ca3af;background:transparent;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.3px}.at.on{color:#fff;border-bottom-color:#60a5fa;background:#111827}.stabs{display:flex;gap:0;padding:0 16px;background:#fff;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}.st{padding:9px 13px;font-size:11px;font-weight:700;cursor:pointer;color:#6b7280;border-bottom:2px solid transparent;transition:all .15s}.st.on{color:#111827;border-bottom-color:#111827}.cnt{padding:14px 16px}.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:7px;padding:10px 12px;border-left:3px solid #e5e7eb}.kpi.lp{border-left-color:#16a34a}.kpi.ln{border-left-color:#dc2626}.kpi.lb{border-left-color:#2563eb}.kpi.lw{border-left-color:#d97706}.kpi.lg{border-left-color:#6b7280}.kl{font-size:9px;color:#9ca3af;text-transform:uppercase;letter-spacing:.9px;margin-bottom:3px;font-weight:800}.kv{font-size:16px;font-weight:900;font-family:'Courier New',monospace}.pos{color:#16a34a}.neg{color:#dc2626}.neu{color:#2563eb}.warn{color:#d97706}.muted{color:#6b7280}.pnl{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin-bottom:10px}.ptl{font-size:9px;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:800;display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.4px}.bc{background:#dbeafe;color:#1e40af}.bcy{background:#fef3c7;color:#92400e}.bv{background:#fee2e2;color:#991b1b}.bd{background:#dcfce7;color:#166534}.bh{background:#ede9fe;color:#5b21b6}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.ctrl{border:1px solid #e5e7eb;background:#fff;border-radius:6px;padding:7px 9px;font-size:11px;font-weight:700;color:#374151}.ctrl.search{min-width:230px;flex:1}.pp-row{display:flex;gap:4px;flex-wrap:wrap}.pp{padding:5px 10px;font-size:10px;font-weight:800;border-radius:4px;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#6b7280;transition:all .12s}.pp.on{background:#111827;color:#fff;border-color:#111827}.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.group-card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px;cursor:pointer;transition:.12s}.group-card:hover{transform:translateY(-1px);border-color:#9ca3af}.group-card.bm{border-left:4px solid #2563eb}.pg-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:8px}.pg-lbl{font-size:10px;font-weight:900;color:#374151;text-transform:uppercase;letter-spacing:.6px}.pg-brd{font-size:9px;color:#9ca3af;font-weight:800}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:700}.chip .cl{color:#9ca3af;margin-right:3px;font-weight:600}table.hm{border-collapse:separate;border-spacing:2px;width:100%;font-size:10px}table.hm th{color:#6b7280;font-weight:900;padding:5px 6px;text-align:center;white-space:nowrap;font-size:9px;letter-spacing:.4px;text-transform:uppercase;background:#f9fafb;cursor:pointer;position:sticky;top:0;z-index:1}table.hm th.yl{text-align:left;padding-left:6px}table.hm td{padding:5px 5px;text-align:center;border-radius:3px;min-width:42px;font-size:10px;font-weight:800;font-family:'Courier New',monospace}table.hm td.yl{color:#374151;font-size:10px;padding-right:8px;text-align:left;font-weight:900;font-family:-apple-system,sans-serif;background:#fff;min-width:120px}table.hm tr:hover td{filter:brightness(.96);outline:1px solid rgba(0,0,0,.05)}.hm-wrap{overflow:auto;max-height:70vh;border:1px solid #e5e7eb;border-radius:8px;background:#fff}.sort-mark{color:#2563eb;margin-left:3px}.hpos5{background:#064e3b;color:#ecfdf5}.hpos4{background:#047857;color:#ecfdf5}.hpos3{background:#10b981;color:#052e16}.hpos2{background:#86efac;color:#14532d}.hpos1{background:#dcfce7;color:#166534}.hneu{background:#f3f4f6;color:#374151}.hneg1{background:#fee2e2;color:#991b1b}.hneg2{background:#fca5a5;color:#7f1d1d}.hneg3{background:#ef4444;color:#fff}.hneg4{background:#b91c1c;color:#fff}.hneg5{background:#7f1d1d;color:#fff}.data-note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;padding:9px 11px;border-radius:7px;font-size:11px;margin-bottom:10px;line-height:1.45}.rel-tbl{width:100%;border-collapse:collapse;font-size:10px;background:#fff}.rel-tbl th{color:#6b7280;font-weight:900;padding:7px 8px;border-bottom:2px solid #f3f4f6;text-align:center;font-size:9px;text-transform:uppercase;letter-spacing:.4px;background:#f9fafb;cursor:pointer;white-space:nowrap}.rel-tbl th.al{text-align:left}.rel-tbl td{padding:7px 8px;text-align:center;border-bottom:1px solid #f3f4f6;font-weight:700;white-space:nowrap}.rel-tbl td.al{text-align:left;color:#111827;font-weight:900}.rel-tbl tr:hover td{background:#f9fafb}.table-wrap{overflow:auto;max-height:72vh;border:1px solid #e5e7eb;border-radius:8px}.benchmark-row td{background:#dbeafe!important}.signal-pill{display:inline-block;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:900;letter-spacing:.3px}.sig-risk-on{background:#dcfce7;color:#166534}.sig-watch{background:#fef3c7;color:#92400e}.sig-good-buy{background:#dbeafe;color:#1e40af}.sig-better-buy{background:#ede9fe;color:#5b21b6}.sig-best-buy{background:#d1fae5;color:#065f46}.sig-risk-off{background:#fee2e2;color:#991b1b}.price-banner{background:#0f172a;border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #1e293b}.pb-main{display:flex;flex-direction:column;min-width:100px}.pb-price{font-size:24px;font-weight:900;font-family:'Courier New',monospace;color:#f1f5f9;line-height:1;letter-spacing:-1px}.pb-chg{font-size:11px;font-weight:800;font-family:'Courier New',monospace;margin-top:3px}.pb-chg.p{color:#4ade80}.pb-chg.n{color:#f87171}.pb-stat{text-align:center;min-width:68px}.pb-stat-label{font-size:8px;color:#64748b;text-transform:uppercase;letter-spacing:.8px;font-weight:900;margin-bottom:3px}.pb-stat-val{font-size:12px;font-weight:900;font-family:'Courier New',monospace;color:#94a3b8}.ddbar{height:8px;background:#e5e7eb;border-radius:4px;position:relative;overflow:hidden;min-width:90px}.ddfill{height:100%;background:#dc2626;border-radius:4px}.tech-cards{display:none;gap:8px;flex-direction:column}.tech-card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px}.tech-card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:7px}.tech-card-title{font-weight:900;color:#111827;font-size:12px;line-height:1.25}.tech-card-sub{font-family:'Courier New',monospace;color:#6b7280;font-size:10px;margin-top:2px}.tech-card-price{font-family:'Courier New',monospace;font-weight:900;font-size:14px;color:#111827;text-align:right}.tech-card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.tech-mini{background:#f9fafb;border-radius:6px;padding:6px 7px}.tech-mini-l{font-size:8px;color:#9ca3af;text-transform:uppercase;font-weight:900;letter-spacing:.5px;margin-bottom:2px}.tech-mini-v{font-size:11px;font-weight:900;font-family:'Courier New',monospace;color:#111827}.empty{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:22px;text-align:center;color:#6b7280;font-weight:700}@media(max-width:760px){.topbar{height:auto;align-items:flex-start;padding:8px 10px;gap:8px;flex-wrap:wrap}.logo{height:28px}.mkt-strip{order:3;flex-basis:100%;margin:4px 0 0}.upd{font-size:9px;margin-top:3px}.modetabs,.atabs,.stabs{overflow-x:auto;flex-wrap:nowrap;padding-left:10px;padding-right:10px}.mt,.at,.st{white-space:nowrap;padding-left:12px;padding-right:12px}.cnt{padding:10px}.krow{grid-template-columns:repeat(2,1fr)}.table-wrap.tech-table{display:none}.tech-cards{display:flex}.group-grid{grid-template-columns:1fr}.pb-price{font-size:23px}}
</style></head><body class="d"><div class="topbar"><div class="logo">Market<em>Pulse</em></div><div class="mkt-strip" id="mktStrip"></div><div class="upd" id="updTs">Loading data...</div></div><div class="modetabs" id="modeTabs"><div class="mt on" data-mode="pulse">Pulse</div><div class="mt" data-mode="heatmap">Return Heatmap</div><div class="mt" data-mode="drawdown">Drawdown</div><div class="mt" data-mode="support">Support Zones</div><div class="mt" data-mode="groups">Groups</div><div class="mt" data-mode="technical">Technical Analysis</div></div><div class="atabs" id="atabs"></div><div class="stabs" id="stabs"></div><div class="cnt" id="cnt"></div><script>
const DATA_PATH='data/market_pulse_combined.json', TF=['weekly','monthly','annual'];
let MP=null, activeMode='pulse', activeGroup='all', activeTF='monthly', activeSector='all', search='', sortState={key:null,dir:1};
const $=id=>document.getElementById(id), n=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const pct=v=>(v==null||Number.isNaN(Number(v)))?'-':`${Number(v).toFixed(2)}%`;
const price=(v,c='')=>{if(v==null||Number.isNaN(Number(v)))return '-';const p=c==='CAD'?'C$':c==='INR'?'₹':c==='USD'?'$':'';return p+Number(v).toLocaleString(undefined,{maximumFractionDigits:2})};
const clsPct=v=>n(v)>0?'pos':n(v)<0?'neg':'muted';
const signalClass=s=>'sig-'+String(s||'Watch').toLowerCase().replace(/\s+/g,'-');
const signalPill=s=>`<span class="signal-pill ${signalClass(s)}">${s||'Watch'}</span>`;
const groupName=g=>g.display_name||g.market_group;
const allItems=()=>MP?.groups?.flatMap(g=>g.items||[])||[];
const selectedGroups=()=>MP.groups.filter(g=>activeGroup==='all'||g.market_group===activeGroup);
const selectedItems=()=>allItems().filter(i=>{const text=[i.symbol,i.name,i.market_group,i.sector_group,i.subsector].join(' ').toLowerCase();return (activeGroup==='all'||i.market_group===activeGroup)&&(activeSector==='all'||i.sector_group===activeSector)&&(!search||text.includes(search.toLowerCase()))});
function heatClass(v){if(v==null||Number.isNaN(Number(v)))return'hneu';v=Number(v);if(v>=25)return'hpos5';if(v>=12)return'hpos4';if(v>=6)return'hpos3';if(v>=2)return'hpos2';if(v>0)return'hpos1';if(v<=-25)return'hneg5';if(v<=-12)return'hneg4';if(v<=-6)return'hneg3';if(v<=-2)return'hneg2';if(v<0)return'hneg1';return'hneu'}
function retVal(i,k){return i.returns?.[k]} function tech(i,tf=activeTF){return i.technicals?.[tf]||{}} function sig(i,tf=activeTF){return i.signals?.[tf]?.combined_signal||'Watch'}
function getSortVal(i,key){if(['symbol','name','market_group','sector_group','subsector'].includes(key))return i[key]||'';if(key==='last_close')return i.last_close;if(key==='curdd')return i.drawdown?.current_drawdown_pct;if(key==='maxdd')return i.drawdown?.max_drawdown_pct;if(key==='signal')return sig(i);if(key.startsWith('ret.'))return retVal(i,key.split('.')[1]);const t=tech(i);if(key in t)return t[key];return i[key]}
function compare(a,b,key){let av=getSortVal(a,key),bv=getSortVal(b,key);if(typeof av==='string')return av.localeCompare(String(bv))*sortState.dir;return(n(av)-n(bv))*sortState.dir}
function sortHeader(label,key,cls=''){const mark=sortState.key===key?(sortState.dir>0?'▲':'▼'):'';return`<th class="${cls}" onclick="sortBy('${key}')">${label}<span class="sort-mark">${mark}</span></th>`}
function sortBy(key){if(sortState.key===key)sortState.dir*=-1;else{sortState.key=key;sortState.dir=1}render()}
async function init(){try{const res=await fetch(DATA_PATH,{cache:'no-store'});if(!res.ok)throw new Error(res.status+' '+res.statusText);MP=await res.json();bind();renderStatic();render()}catch(e){$('cnt').innerHTML=`<div class="empty">Could not load <b>${DATA_PATH}</b>. Confirm backend sync placed the real JSON file in frontend /data/.<br>${e.message}</div>`}}
function bind(){document.querySelectorAll('.mt').forEach(el=>el.onclick=()=>{activeMode=el.dataset.mode;sortState={key:null,dir:1};document.querySelectorAll('.mt').forEach(x=>x.classList.remove('on'));el.classList.add('on');renderStatic();render()})}
function renderStatic(){renderMarketStrip();renderGroupTabs();renderSubTabs();$('updTs').textContent=`${(MP.generated_at||'').replace('T',' ').replace('+00:00',' UTC')} | ${MP.universe_count||allItems().length} instruments`}
function renderMarketStrip(){$('mktStrip').innerHTML=MP.groups.map(g=>{const bm=(g.items||[]).find(i=>i.symbol===g.benchmark_symbol)||(g.items||[])[0]||{},v=retVal(bm,'monthly');return`<div class="ms ${activeGroup===g.market_group?'on':''}" onclick="activeGroup='${g.market_group}';renderStatic();render()"><div class="ms-n">${g.market_group}</div><div class="ms-p">${g.benchmark_symbol||'-'}</div><div class="ms-v ${n(v)>0?'p':n(v)<0?'n':'z'}">${pct(v)}</div></div>`}).join('')}
function renderGroupTabs(){$('atabs').innerHTML=`<div class="at ${activeGroup==='all'?'on':''}" onclick="activeGroup='all';renderStatic();render()">All Groups</div>`+MP.groups.map(g=>`<div class="at ${activeGroup===g.market_group?'on':''}" onclick="activeGroup='${g.market_group}';renderStatic();render()">${groupName(g)}</div>`).join('')}
function renderSubTabs(){const sectors=[...new Set(selectedItems().map(i=>i.sector_group).filter(Boolean))].sort();let tfTabs=TF.map(tf=>`<div class="st ${activeTF===tf?'on':''}" onclick="activeTF='${tf}';sortState={key:null,dir:1};render()">${tf.toUpperCase()}</div>`).join('');let secTabs=`<div class="st ${activeSector==='all'?'on':''}" onclick="activeSector='all';render()">All Sectors</div>`+sectors.slice(0,18).map(s=>`<div class="st ${activeSector===s?'on':''}" onclick="activeSector='${s.replaceAll("'","\\'")}';render()">${s}</div>`).join('');$('stabs').innerHTML=(['pulse','support','technical'].includes(activeMode))?tfTabs:secTabs}
function renderControls(){return`<div class="controls"><input class="ctrl search" placeholder="Search symbol, name, sector..." value="${search}" oninput="search=this.value;render()"><select class="ctrl" onchange="activeSector=this.value;renderStatic();render()"><option value="all">All sectors</option>${[...new Set(allItems().map(i=>i.sector_group).filter(Boolean))].sort().map(s=>`<option ${activeSector===s?'selected':''}>${s}</option>`).join('')}</select><div class="pp-row">${TF.map(tf=>`<button class="pp ${activeTF===tf?'on':''}" onclick="activeTF='${tf}';render()">${tf.toUpperCase()}</button>`).join('')}</div></div>`}
function renderKpis(items=selectedItems()){const risk=items.filter(i=>sig(i)==='Risk On').length,buy=items.filter(i=>['Good Buy','Better Buy','Best Buy'].includes(sig(i))).length,avgM=items.reduce((s,i)=>s+n(retVal(i,'monthly')),0)/(items.length||1),avgY=items.reduce((s,i)=>s+n(retVal(i,'ytd')),0)/(items.length||1),avgDD=items.reduce((s,i)=>s+n(i.drawdown?.current_drawdown_pct),0)/(items.length||1);return`<div class="krow"><div class="kpi lb"><div class="kl">Visible Instruments</div><div class="kv">${items.length}</div></div><div class="kpi lp"><div class="kl">${activeTF} Risk On</div><div class="kv">${risk}</div></div><div class="kpi lw"><div class="kl">${activeTF} Buy Zones</div><div class="kv">${buy}</div></div><div class="kpi ${avgM>=0?'lp':'ln'}"><div class="kl">Avg Monthly</div><div class="kv ${avgM>=0?'pos':'neg'}">${pct(avgM)}</div></div><div class="kpi ${avgY>=0?'lp':'ln'}"><div class="kl">Avg YTD</div><div class="kv ${avgY>=0?'pos':'neg'}">${pct(avgY)}</div></div><div class="kpi ln"><div class="kl">Avg Current DD</div><div class="kv neg">${pct(avgDD)}</div></div></div>`}
function render(){renderSubTabs();if(activeMode==='pulse')renderPulse();if(activeMode==='heatmap')renderHeatmap();if(activeMode==='drawdown')renderDrawdown();if(activeMode==='support')renderSupport();if(activeMode==='groups')renderGroups();if(activeMode==='technical')renderTechnical()}
function renderPulse(){const groups=selectedGroups();$('cnt').innerHTML=renderControls()+renderKpis()+`<div class="group-grid">`+groups.map(g=>{const bm=(g.items||[]).find(i=>i.symbol===g.benchmark_symbol)||(g.items||[])[0]||{};return`<div class="group-card bm"><div class="pg-hdr"><div><div class="pg-lbl">${groupName(g)}</div><div class="pg-brd">Benchmark ${g.benchmark_symbol} | ${(g.items||[]).length} items</div></div>${signalPill(g.group_signals?.[activeTF])}</div><div class="price-banner"><div class="pb-main"><div class="pb-price">${price(bm.last_close,bm.currency)}</div><div class="pb-chg ${n(retVal(bm,'daily'))>=0?'p':'n'}">${pct(retVal(bm,'daily'))} daily</div></div><div class="pb-stat"><div class="pb-stat-label">Monthly</div><div class="pb-stat-val ${clsPct(retVal(bm,'monthly'))}">${pct(retVal(bm,'monthly'))}</div></div><div class="pb-stat"><div class="pb-stat-label">YTD</div><div class="pb-stat-val ${clsPct(retVal(bm,'ytd'))}">${pct(retVal(bm,'ytd'))}</div></div><div class="pb-stat"><div class="pb-stat-label">Drawdown</div><div class="pb-stat-val neg">${pct(bm.drawdown?.current_drawdown_pct)}</div></div></div><div class="chips"><span class="chip"><span class="cl">Weekly</span>${g.group_signals?.weekly||'-'}</span><span class="chip"><span class="cl">Monthly</span>${g.group_signals?.monthly||'-'}</span><span class="chip"><span class="cl">Annual</span>${g.group_signals?.annual||'-'}</span></div></div>`}).join('')+`</div>`+renderPulseTable()}
function renderPulseTable(){let rows=selectedItems();if(sortState.key)rows=[...rows].sort((a,b)=>compare(a,b,sortState.key));return`<div class="pnl" style="margin-top:10px"><div class="ptl">Instrument Pulse <span class="muted">click headers to sort</span></div><div class="table-wrap"><table class="rel-tbl"><thead><tr>${sortHeader('Symbol','symbol','al')}${sortHeader('Group','market_group')}${sortHeader('Sector','sector_group')}${sortHeader('Close','last_close')}${sortHeader('Daily','ret.daily')}${sortHeader('Weekly','ret.weekly')}${sortHeader('Monthly','ret.monthly')}${sortHeader('YTD','ret.ytd')}${sortHeader('Signal','signal')}</tr></thead><tbody>${rows.map(i=>`<tr class="${i.role==='benchmark'?'benchmark-row':''}"><td class="al">${i.symbol}<br><span class="muted" style="font-size:9px">${i.name||''}</span></td><td>${i.market_group}</td><td>${i.sector_group||'-'}</td><td>${price(i.last_close,i.currency)}</td><td class="${clsPct(retVal(i,'daily'))}">${pct(retVal(i,'daily'))}</td><td class="${clsPct(retVal(i,'weekly'))}">${pct(retVal(i,'weekly'))}</td><td class="${clsPct(retVal(i,'monthly'))}">${pct(retVal(i,'monthly'))}</td><td class="${clsPct(retVal(i,'ytd'))}">${pct(retVal(i,'ytd'))}</td><td>${signalPill(sig(i))}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderHeatmap(){let items=selectedItems();if(sortState.key)items=[...items].sort((a,b)=>compare(a,b,sortState.key));const hasCalendar=items.some(i=>i.calendar_returns);const note=hasCalendar?'':`<div class="data-note"><b>Calendar monthly heatmap fallback:</b> backend currently provides Annual, YTD, 6M, 3M, 1M, MTD, Weekly and Daily returns. True Jan-Dec calendar monthly history needs backend field <b>calendar_returns</b>. Current month shown here uses <b>MTD based on latest close</b>.</div>`;$('cnt').innerHTML=renderControls()+renderKpis(items)+note+`<div class="pnl"><div class="ptl">Combined Return Heatmap <span class="muted">Annual | YTD | rolling windows | latest-close MTD</span></div><div class="hm-wrap"><table class="hm"><thead><tr>${sortHeader('Symbol','symbol','yl')}${sortHeader('Annual','ret.annual')}${sortHeader('YTD','ret.ytd')}${sortHeader('6M','ret.r6m')}${sortHeader('3M','ret.r3m')}${sortHeader('1M','ret.r1m')}${sortHeader('MTD','ret.mtd')}${sortHeader('Weekly','ret.weekly')}${sortHeader('Daily','ret.daily')}${sortHeader('Cur DD','curdd')}${sortHeader('Signal','signal')}</tr></thead><tbody>${items.map(i=>`<tr class="${i.role==='benchmark'?'benchmark-row':''}"><td class="yl">${i.symbol}<br><span class="muted" style="font-size:9px">${i.market_group} · ${i.sector_group||''}</span></td>${['annual','ytd','r6m','r3m','r1m','mtd','weekly','daily'].map(k=>`<td class="${heatClass(retVal(i,k))}">${pct(retVal(i,k))}</td>`).join('')}<td class="${heatClass(i.drawdown?.current_drawdown_pct)}">${pct(i.drawdown?.current_drawdown_pct)}</td><td>${signalPill(sig(i))}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderDrawdown(){let items=selectedItems();if(sortState.key)items=[...items].sort((a,b)=>compare(a,b,sortState.key));else items=[...items].sort((a,b)=>n(a.drawdown?.current_drawdown_pct)-n(b.drawdown?.current_drawdown_pct));$('cnt').innerHTML=renderControls()+renderKpis(items)+`<div class="pnl"><div class="ptl">Drawdown Analysis <span class="muted">current and max drawdown from available history</span></div><div class="table-wrap"><table class="rel-tbl"><thead><tr>${sortHeader('Symbol','symbol','al')}${sortHeader('Group','market_group')}${sortHeader('Close','last_close')}${sortHeader('Current DD','curdd')}${sortHeader('Max DD','maxdd')}${sortHeader('1Y','ret.r1y')}${sortHeader('YTD','ret.ytd')}${sortHeader('Signal','signal')}</tr></thead><tbody>${items.map(i=>{const cur=Math.abs(n(i.drawdown?.current_drawdown_pct)),max=Math.abs(n(i.drawdown?.max_drawdown_pct));return`<tr class="${i.role==='benchmark'?'benchmark-row':''}"><td class="al">${i.symbol}<br><span class="muted" style="font-size:9px">${i.name||''}</span></td><td>${i.market_group}</td><td>${price(i.last_close,i.currency)}</td><td class="neg">${pct(i.drawdown?.current_drawdown_pct)}<div class="ddbar"><div class="ddfill" style="width:${Math.min(cur,60)/60*100}%"></div></div></td><td class="neg">${pct(i.drawdown?.max_drawdown_pct)}<div class="ddbar"><div class="ddfill" style="width:${Math.min(max,80)/80*100}%"></div></div></td><td class="${clsPct(retVal(i,'r1y'))}">${pct(retVal(i,'r1y'))}</td><td class="${clsPct(retVal(i,'ytd'))}">${pct(retVal(i,'ytd'))}</td><td>${signalPill(sig(i))}</td></tr>`}).join('')}</tbody></table></div></div>`}
function renderSupport(){let items=selectedItems();if(sortState.key)items=[...items].sort((a,b)=>compare(a,b,sortState.key));$('cnt').innerHTML=renderControls()+renderKpis(items)+`<div class="pnl"><div class="ptl">Support Zones / CPR / Pivot — ${activeTF.toUpperCase()} <span class="muted">based on close price</span></div><div class="table-wrap"><table class="rel-tbl"><thead><tr>${sortHeader('Symbol','symbol','al')}${sortHeader('Close','last_close')}${sortHeader('Pivot','pivot')}${sortHeader('BC','bc')}${sortHeader('TC','tc')}${sortHeader('S1','s1')}${sortHeader('S2','s2')}${sortHeader('R1','r1')}${sortHeader('R2','r2')}${sortHeader('Dist S1','distance_to_s1_pct')}${sortHeader('Dist S2','distance_to_s2_pct')}${sortHeader('Signal','signal')}</tr></thead><tbody>${items.map(i=>{const t=tech(i);return`<tr class="${i.role==='benchmark'?'benchmark-row':''}"><td class="al">${i.symbol}<br><span class="muted" style="font-size:9px">${i.market_group} · ${i.sector_group||''}</span></td><td>${price(i.last_close,i.currency)}</td><td>${price(t.pivot,i.currency)}</td><td>${price(t.bc,i.currency)}</td><td>${price(t.tc,i.currency)}</td><td>${price(t.s1,i.currency)}</td><td>${price(t.s2,i.currency)}</td><td>${price(t.r1,i.currency)}</td><td>${price(t.r2,i.currency)}</td><td class="${clsPct(t.distance_to_s1_pct)}">${pct(t.distance_to_s1_pct)}</td><td class="${clsPct(t.distance_to_s2_pct)}">${pct(t.distance_to_s2_pct)}</td><td>${signalPill(sig(i))}</td></tr>`}).join('')}</tbody></table></div></div>`}
function renderGroups(){const groups=selectedGroups();$('cnt').innerHTML=renderControls()+renderKpis()+`<div class="pnl"><div class="ptl">Group Comparison</div><div class="table-wrap"><table class="rel-tbl"><thead><tr><th class="al">Group</th><th>Benchmark</th><th>Items</th><th>Weekly</th><th>Monthly</th><th>Annual</th><th>Benchmark Monthly</th><th>Benchmark YTD</th><th>Benchmark DD</th></tr></thead><tbody>${groups.map(g=>{const bm=(g.items||[]).find(i=>i.symbol===g.benchmark_symbol)||(g.items||[])[0]||{};return`<tr><td class="al">${groupName(g)}<br><span class="muted" style="font-size:9px">${g.geography_bucket}</span></td><td>${g.benchmark_symbol}</td><td>${(g.items||[]).length}</td><td>${signalPill(g.group_signals?.weekly)}</td><td>${signalPill(g.group_signals?.monthly)}</td><td>${signalPill(g.group_signals?.annual)}</td><td class="${clsPct(retVal(bm,'monthly'))}">${pct(retVal(bm,'monthly'))}</td><td class="${clsPct(retVal(bm,'ytd'))}">${pct(retVal(bm,'ytd'))}</td><td class="neg">${pct(bm.drawdown?.current_drawdown_pct)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function renderTechnical(){let items=selectedItems();if(sortState.key)items=[...items].sort((a,b)=>compare(a,b,sortState.key));const rows=items.map(i=>{const t=tech(i),p=t.price_position||{},position=p.inside_cpr?'Inside CPR':p.above_cpr?'Above CPR':p.below_cpr?'Below CPR':p.above_pivot?'Above Pivot':'Below Pivot';return`<tr class="${i.role==='benchmark'?'benchmark-row':''}"><td class="al">${i.symbol}<br><span class="muted" style="font-size:9px">${i.name||''}</span></td><td>${i.market_group}</td><td>${price(i.last_close,i.currency)}</td><td>${price(t.pivot,i.currency)}</td><td>${price(t.bc,i.currency)}</td><td>${price(t.tc,i.currency)}</td><td>${price(t.s1,i.currency)}</td><td>${price(t.s2,i.currency)}</td><td>${price(t.r1,i.currency)}</td><td>${price(t.r2,i.currency)}</td><td>${position}</td><td>${t.signal||'-'}</td><td>${signalPill(sig(i))}</td></tr>`}).join('');const cards=items.map(i=>{const t=tech(i);return`<div class="tech-card"><div class="tech-card-top"><div><div class="tech-card-title">${i.symbol} · ${i.name||''}</div><div class="tech-card-sub">${i.market_group} · ${i.sector_group||''}</div></div><div class="tech-card-price">${price(i.last_close,i.currency)}</div></div><div>${signalPill(sig(i))}</div><div class="tech-card-grid"><div class="tech-mini"><div class="tech-mini-l">Pivot</div><div class="tech-mini-v">${price(t.pivot,i.currency)}</div></div><div class="tech-mini"><div class="tech-mini-l">CPR</div><div class="tech-mini-v">${price(t.bc,i.currency)} / ${price(t.tc,i.currency)}</div></div><div class="tech-mini"><div class="tech-mini-l">S1 / S2</div><div class="tech-mini-v">${price(t.s1,i.currency)} / ${price(t.s2,i.currency)}</div></div><div class="tech-mini"><div class="tech-mini-l">R1 / R2</div><div class="tech-mini-v">${price(t.r1,i.currency)} / ${price(t.r2,i.currency)}</div></div></div></div>`}).join('');$('cnt').innerHTML=renderControls()+renderKpis(items)+`<div class="pnl"><div class="ptl">Technical Analysis — ${activeTF.toUpperCase()} <span class="muted">Technical tab remains last</span></div><div class="table-wrap tech-table"><table class="rel-tbl"><thead><tr>${sortHeader('Symbol','symbol','al')}${sortHeader('Group','market_group')}${sortHeader('Close','last_close')}${sortHeader('Pivot','pivot')}${sortHeader('BC','bc')}${sortHeader('TC','tc')}${sortHeader('S1','s1')}${sortHeader('S2','s2')}${sortHeader('R1','r1')}${sortHeader('R2','r2')}<th>Position</th><th>Tech Signal</th><th>Combined</th></tr></thead><tbody>${rows}</tbody></table></div><div class="tech-cards">${cards}</div></div>`}
init();
</script></body></html>
