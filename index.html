function compactPivot(rec){
  if(!rec)return '—';
  const vals=[rec.r2,rec.r1,rec.pivot,rec.s1,rec.s2];
  if(vals.some(v=>v===null||v===undefined||!Number.isFinite(Number(v))))return '—';
  return vals.map(v=>Number(v).toFixed(2)).join('-');
}

function rotationRecord(i){return techRec(i)?.rotation||null}
function rrgPoint(rrg){return rrg&&typeof rrg==='object'?rrg:null}
function rotationDirection(rrg){
  const trail=Array.isArray(rrg?.trail)?rrg.trail:[];
  if(trail.length<2)return '—';
  const a=trail[trail.length-2],b=trail[trail.length-1];
  if(a.quadrant!==b.quadrant)return `${String(a.quadrant||'').replace('_',' ')} → ${String(b.quadrant||'').replace('_',' ')}`;
  const dx=num(b.rs_ratio)-num(a.rs_ratio),dy=num(b.rs_momentum)-num(a.rs_momentum);
  if(dx>0&&dy>0)return 'Strengthening';
  if(dx<0&&dy<0)return 'Weakening';
  if(dx>0&&dy<0)return 'Mixed · RS up';
  if(dx<0&&dy>0)return 'Mixed · Momentum up';
  return 'Stable';
}
function combinedInterpretation(daily,weekly,quadrant){
  const bull=s=>['Risk On','Good Buy','Better Buy','Best Buy'].includes(String(s||''));
  const bear=s=>['Risk Off'].includes(String(s||''));
  const db=bull(daily),wb=bull(weekly),dw=bear(daily),ww=bear(weekly);
  if(!quadrant)return 'Rotation unavailable';
  if(quadrant==='leading'&&db&&wb)return 'Aligned strength · daily, weekly and relative trend';
  if(quadrant==='improving'&&db)return 'Emerging strength · daily confirmation';
  if(quadrant==='weakening'&&(db||wb))return 'Technical strength · relative momentum fading';
  if(quadrant==='lagging'&&dw&&ww)return 'Aligned weakness · technical and relative trend';
  if((quadrant==='leading'||quadrant==='improving')&&!(db&&wb))return 'Relative strength positive · technical confirmation pending';
  if((quadrant==='lagging'||quadrant==='weakening')&&(db||wb))return 'Technical rebound · relative trend remains weak';
  return 'Mixed signals · wait for confirmation';
}

          ${groups.map(g=>`<option value="${esc(g)}" ${STATE.techGroup===g?'selected':''}>${esc(g==='ALL'?'All Markets':g)}</option>`).join('')}

function sortableTable(rows,key){const f=(STATE.filter||'').toLowerCase();if(f)rows=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(f)));const cols=Object.keys(rows[0]||{}).filter(c=>c!=='_item'),sort=STATE.sort[key]||{col:null,dir:1};if(sort.col)rows=[...rows].sort((a,b)=>{const av=a[sort.col],bv=b[sort.col],an=num(av),bn=num(bv);if(an!==null&&bn!==null)return(an-bn)*sort.dir;return String(av??'').localeCompare(String(bv??''))*sort.dir});const technical=key==='technical';return`<div class="table-wrap ${technical?'index-table-wrap':''}"><table class="${technical?'index-table':''}"><tr>${cols.map(c=>`<th onclick="sortTable('${key}','${esc(c)}')">${esc(c)} ${sort.col===c?(sort.dir>0?'▲':'▼'):''}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>cell(c,r[c])).join('')}</tr>`).join('')||'<tr><td>No rows</td></tr>'}</table></div>`}
function cell(c,v){
  if(c==='Signal'||c==='Price vs Levels'||c==='Daily Signal ▲'||c==='Weekly Signal ▲')
    return `<td>${zbadge(v)}</td>`;

  if(c==='Daily Signal Levels'||c==='Weekly Signal Levels')
    return `<td class="small muted">${esc(v||'Unavailable')}</td>`;

  if(c==='Daily Pivot'||c==='Weekly Pivot')
    return `<td class="mono">${esc(v??'—')}</td>`;

  if(c==='RS-Ratio'||c==='RS-Momentum'||c==='Weekly RS-Ratio'||c==='Weekly RS-Momentum'||c==='Daily RS-Ratio'||c==='Daily RS-Momentum')
    return `<td class="mono">${v===null||v===undefined?'—':num(v).toFixed(2)}</td>`;

  if(c==='Weekly Price RRG'||c==='Daily Price RRG')
    return `<td>${v==='Unavailable'?'—':`<span class="zone ${String(v).toLowerCase()==='leading'?'best':String(v).toLowerCase()==='improving'?'better':String(v).toLowerCase()==='weakening'?'watch':String(v).toLowerCase()==='lagging'?'bad':'neutral'}">${esc(v)}</span>`}</td>`;

  if(c==='Rotation Direction'||c==='Combined Interpretation'||c==='Daily VSA'||c==='Weekly VSA')
    return `<td class="small" style="text-align:left;white-space:normal;min-width:170px;max-width:280px">${esc(v||'—')}</td>`;

  if(c==='Level Detail')
    return `<td class="small muted">${esc(v||'')}</td>`;

  if(['Close','Pivot','S1','S2','R1','R2'].includes(c))
    return `<td class="mono">${money(v)}</td>`;

  if(['MTD','YTD','MonthAvg','AvgAnnual','CurrentDD','MaxDD','DD','MTD vs Benchmark'].includes(c))
    return `<td class="${cls(v)} mono">${fmt(v)}</td>`;

  if(['Name','Name ▲','Symbol','Benchmark','Asset'].includes(c))
    return `<td class="sym ${c.startsWith('Name')||c==='Asset'?'':'mono'}">${esc(v)}</td>`;

  return `<td>${esc(v??'—')}</td>`;
}function sortTable(key,col){const s=STATE.sort[key]||{};STATE.sort[key]={col,dir:s.col===col?-(s.dir||1):-1};render()}window.sortTable=sortTable;
function drawdownTable(items){return sortableTable(items.map(i=>({Symbol:i.symbol,Name:itemName(i),Close:close(i),CurrentDD:dd(i),MaxDD:maxdd(i),MTD:mtd(i),YTD:ytd(i),_item:i})).sort((a,b)=>(a.CurrentDD??0)-(b.CurrentDD??0)).slice(0,30),'drawdown')}
function supportTable(items){return sortableTable(items.map(i=>({Symbol:i.symbol,Close:close(i),Signal:signal(i),Pivot:level(i,'pivot'),S1:level(i,'s1'),S2:level(i,'s2'),R1:level(i,'r1'),R2:level(i,'r2'),CPR:cprText(i),_item:i})).slice(0,50),'support')}

function renderAIPulse(){
