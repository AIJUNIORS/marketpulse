<div class="subbar" id="subbar"></div><div class="sectionbar" id="sectionbar"></div><div class="cnt" id="app"><div class="loading">Loading MarketPulse JSON…</div></div><div class="footer">MarketPulse · close-based returns · prices preserved · technical analysis at the end</div>
<script>
const DATA_PATHS=['data/market_pulse_combined.json','./data/market_pulse_combined.json','market_pulse_combined.json','./market_pulse_combined.json'];
const LAST_PATHS=['data/last_updated.json','./data/last_updated.json','last_updated.json','./last_updated.json'];
const TECH_PATHS=['data/technical_summary.json','./data/technical_summary.json','technical_summary.json','./technical_summary.json'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BENCH={US:'SPY',Canada:'XIC.TO',India:'^NSEI',Global:'ACWI',Gold:'GC=F',SilverMetals:'SI=F',CrudeOil:'CL=F',NaturalGas:'NG=F',Bonds:'TLT',Crypto:'BTC-USD'};
const MAJOR_SYMS=['SPY','QQQ','DIA','IWM','^GSPC','^IXIC','XIC.TO','^GSPTSE','^NSEI','ACWI','GC=F','SI=F','CL=F','NG=F','TLT','SHY','BTC-USD','ETH-USD'];
let STATE={data:null,last:null,techRaw:null,techMap:{},groups:[],items:[],view:'pulse',group:'ALL',broadKey:'CROSS',broadSection:'overview',techGroup:'ALL',techTf:'monthly',sort:{},filter:''};
async function fetchFirst(paths,optional=false){let e;for(const p of paths){try{const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json();e=new Error(p+' '+r.status)}catch(x){e=x}}if(optional)return null;throw e||new Error('No JSON found')}
function num(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;const n=parseFloat(String(v).replace('%','').replace('+','').replace(/,/g,''));return isFinite(n)?n:null}
function get(o,paths,f=null){for(const p of paths){let x=o;for(const k of p.split('.')){if(x&&Object.prototype.hasOwnProperty.call(x,k))x=x[k];else{x=undefined;break}}if(x!==undefined&&x!==null&&x!=='')return x}return f}
function fmt(v,d=1){const n=num(v);return n===null?'—':(n>=0?'+':'')+n.toFixed(d)+'%'}function money(v){const n=num(v);if(n===null)return'—';return n>=1000?n.toLocaleString(undefined,{maximumFractionDigits:0}):n.toLocaleString(undefined,{maximumFractionDigits:2})}function cls(v){const n=num(v);return n===null?'z':n>=0?'p':'n'}function avg(a){const x=a.map(num).filter(v=>v!==null);return x.length?x.reduce((p,c)=>p+c,0)/x.length:null}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cy(){return new Date().getFullYear()}function cm(){return new Date().getMonth()}function itemName(i){return i.name||i.display_name||i.long_name||i.symbol||'Unknown'}function groupName(g){return g.display_name||g.market_group||g.name||'Group'}function safeSym(s){return String(s||'').replace(/\^/g,'').replace(/=/g,'').replace(/\./g,'_').toUpperCase()}
function ret(i,k){return num(get(i,[`returns.${k}`,`returns.${k.toUpperCase()}`,`kpi.${k}`,`kpi.${k.toUpperCase()}`,k,`${k}_pct`,`return_${k}`]))}function mtd(i){return ret(i,'mtd')}function ytd(i){return ret(i,'ytd')}function r1m(i){return ret(i,'r1m')}function r3m(i){return ret(i,'r3m')}function close(i){return num(get(i,['last_close','close','price','last_price','current_price','Current_Price','kpi.close','kpi.last_close']))}
function dd(i){return num(get(i,['drawdown.current_drawdown','drawdown.current_drawdown_pct','drawdown.current_dd','drawdown.current_dd_pct','drawdown.curdd','drawdown.curdd_pct','kpi.curdd','kpi.current_dd','kpi.current_drawdown','current_dd','current_drawdown','curdd','dd','drawdown.max_drawdown','maxdd','kpi.maxdd']))}
function maxdd(i){return num(get(i,['drawdown.max_drawdown','drawdown.max_drawdown_pct','drawdown.maxdd','drawdown.maxdd_pct','kpi.maxdd','maxdd','max_drawdown']))}
function signal(i){return get(i,['signals.primary','signals.signal','signal','technicals.signal','technical.signal','zone'],'—')}
function monthAvg(i){const mi=cm(),m=MONTHS[mi].toLowerCase();let v=num(get(i,[`seasonality.monthly_avg.${m}`,`seasonality.monthly_average.${m}`,`seasonality.avg_by_month.${m}`,`seasonality.avg.${mi}`,`seasonality.${m}.avg`,`seas.avg.${mi}`,`seas.monthly_avg.${m}`,`seasonality.current_month_avg`,`seasonality.selected_month_avg`]));if(v!==null)return v;const years=get(i,['monthly_returns_by_year','monthly_returns','monthly'],null);if(years&&typeof years==='object'){return avg(Object.keys(years).filter(y=>+y<cy()).map(y=>{const r=years[y];return Array.isArray(r)?r[mi]:(r[MONTHS[mi]]??r[m]??r[String(mi+1)])}))}return null}
function posRate(i,mi=cm()){const m=MONTHS[mi].toLowerCase();return num(get(i,[`seasonality.pos_rate.${m}`,`seasonality.positive_rate.${m}`,`seasonality.monthly_pos_rate.${m}`,`seas.posRate.${mi}`,`seasonality.posRate.${mi}`]))}
function avgAnnual(i){let v=num(get(i,['annual_return_stats.average','annual_return_stats.avg','annual_return_stats.mean','returns.avg_annual','avg_annual','kpi.avg_annual']));if(v!==null)return v;const y=get(i,['annual_returns_by_year','annual_returns','annual'],null);return y&&typeof y==='object'?avg(Object.values(y)):null}
function annualObj(i){return get(i,['annual_returns_by_year','annual_returns','annual'],{})||{}}function monthlyObj(i){return get(i,['monthly_returns_by_year','monthly_returns','monthly'],{})||{}}
function annual(i,yr){return num(annualObj(i)[yr])}function monthly(i,yr,mi){const row=monthlyObj(i)[yr];if(!row)return null;return num(Array.isArray(row)?row[mi]:(row[MONTHS[mi]]??row[MONTHS[mi].toLowerCase()]??row[String(mi+1)]))}
function heatColor(v){const n=num(v);if(n===null)return'background:#f3f4f6;color:#9ca3af';const a=Math.min(Math.abs(n),12)/12;return n>=0?`background:rgba(22,163,74,${.12+a*.55});color:#14532d`:`background:rgba(220,38,38,${.12+a*.55});color:#7f1d1d`}
function zbadge(s){const x=String(s||'').toLowerCase();if(x.includes('best'))return'<span class="zone best">Best Buy</span>';if(x.includes('better'))return'<span class="zone better">Better Buy</span>';if(x.includes('good'))return'<span class="zone good">Good Buy</span>';if(x.includes('risk'))return'<span class="zone risk">Risk On</span>';if(x.includes('watch'))return'<span class="zone watch">Watch</span>';if(x.includes('below')||x.includes('weak'))return'<span class="zone bad">'+esc(s)+'</span>';return'<span class="zone neutral">'+esc(s||'—')+'</span>'}
function norm(d){let groups=(d.groups||[]).map(g=>({...g,market_group:g.market_group||g.name||g.display_name}));if(!groups.length&&Array.isArray(d.items)){const by={};d.items.forEach(i=>{const mg=i.market_group||i.group||'Other';(by[mg]||(by[mg]={market_group:mg,display_name:mg,items:[]})).items.push(i)});groups=Object.values(by)}const items=[];groups.forEach(g=>(g.items||[]).forEach(it=>items.push({...it,market_group:it.market_group||g.market_group,sector_group:it.sector_group||g.sector_group,group_display_name:groupName(g),group_benchmark_symbol:g.benchmark_symbol||BENCH[g.market_group]})));return{groups,items}}
function buildTechMap(raw){const map={};function add(o){if(!o||typeof o!=='object')return;const s=o.symbol||o.ticker||o.Symbol||o.Ticker;if(s){map[String(s).toUpperCase()]=o;map[safeSym(s)]=o}}function walk(x){if(Array.isArray(x))x.forEach(walk);else if(x&&typeof x==='object'){add(x);Object.values(x).forEach(v=>{if(v&&typeof v==='object')walk(v)})}}walk(raw);return map}
function techRec(i){return STATE.techMap[String(i.symbol||'').toUpperCase()]||STATE.techMap[safeSym(i.symbol)]||{}}
function techVal(i,k,tf=STATE.techTf){const r=techRec(i);const paths=[`technical.${tf}.levels.${k}`,`technical.${tf}.${k}`,`technicals.${tf}.levels.${k}`,`technicals.${tf}.${k}`,`technical.levels.${k}`,`technical.${k}`,`technicals.levels.${k}`,`technicals.${k}`,`levels.${tf}.${k}`,`levels.${k}`,`pivot_points.${tf}.${k}`,`pivot_points.${k}`,`${tf}.${k}`,k,k.toUpperCase()];const v=get(i,paths,null);if(v!==null)return v;return get(r,paths,null)}
function level(i,k,tf=STATE.techTf){return num(techVal(i,k,tf))}
function cprText(i,tf=STATE.techTf){const lo=level(i,'cpr_low',tf)??level(i,'bc',tf)??level(i,'bottom_central',tf);const hi=level(i,'cpr_high',tf)??level(i,'tc',tf)??level(i,'top_central',tf);const pos=techVal(i,'cpr_position',tf)||techVal(i,'position',tf)||techVal(i,'cpr',tf);if(lo!==null&&hi!==null)return `${money(lo)}–${money(hi)}`;return pos||'—'}
function setUpdated(){const ts=STATE.last?.generated_at||STATE.data?.generated_at,count=STATE.last?.universe_count||STATE.data?.universe_count||STATE.items.length;document.getElementById('updated').textContent=ts?`Updated ${String(ts).replace('T',' ').replace('+00:00',' UTC')} · ${count} items`:`${count} items`}
function groupBench(g){const sym=g.benchmark_symbol||BENCH[g.market_group];return (g.items||[]).find(i=>String(i.symbol)===String(sym))||(g.items||[]).find(i=>String(i.role||'').toLowerCase().includes('benchmark'))||(g.items||[]).find(i=>MAJOR_SYMS.includes(String(i.symbol)))||(g.items||[])[0]}
function benchmarks(){return STATE.groups.map(g=>{const b=groupBench(g);return b?{...b,display_group:groupName(g),asset_key:(g.market_group+'_'+b.symbol).replace(/[^A-Za-z0-9_]/g,'_')}:null}).filter(Boolean)}
function broadAssets(){const arr=[];const seen=new Set();function add(i,label){if(!i||!i.symbol)return;const key=String(i.symbol).toUpperCase();if(seen.has(key))return;seen.add(key);arr.push({...i,display_group:label||i.group_display_name||i.market_group,asset_key:safeSym(i.symbol)})}benchmarks().forEach(b=>add(b,b.display_group));STATE.items.forEach(i=>{const role=String(i.role||i.type||i.category||'').toLowerCase();if(MAJOR_SYMS.includes(String(i.symbol))||role.includes('benchmark')||role.includes('major')||role.includes('market')||role.includes('index'))add(i,i.group_display_name)});return arr}
function buildStrip(){const benches=benchmarks();document.getElementById('mktStrip').innerHTML=benches.map(b=>`<div class="ms" onclick="showBroadAsset('${esc(b.asset_key)}')"><div class="ms-n">${esc(b.display_group||b.market_group)} · ${esc(b.symbol)}</div><div class="ms-p">${money(close(b))}</div><div class="ms-v"><span class="${cls(mtd(b))}">M ${fmt(mtd(b))}</span><span class="${cls(ytd(b))}">Y ${fmt(ytd(b))}</span></div></div>`).join('')}
function kpi(label,val,sub='',type='lg',pct=true){return`<div class="kpi ${type}"><div class="kl">${label}</div><div class="kv ${pct?cls(val):''}">${pct?fmt(val):esc(val)}</div>${sub?`<div class="ks">${sub}</div>`:''}</div>`}
function itemsForGroupKey(key){if(key==='ALL')return STATE.items;return STATE.items.filter(i=>i.market_group===key)}function summaries(items){return{m:avg(items.map(mtd)),y:avg(items.map(ytd)),ma:avg(items.map(monthAvg)),aa:avg(items.map(avgAnnual)),cd:avg(items.map(dd)),md:avg(items.map(maxdd)),pos:items.filter(i=>num(mtd(i))>=0).length,neg:items.filter(i=>num(mtd(i))<0).length,top:[...items].filter(i=>mtd(i)!==null).sort((a,b)=>mtd(b)-mtd(a)),bot:[...items].filter(i=>mtd(i)!==null).sort((a,b)=>mtd(a)-mtd(b))}}
function renderSubbars(){const sb=document.getElementById('subbar'),sec=document.getElementById('sectionbar');sb.className='subbar';sec.className='sectionbar';sb.innerHTML='';sec.innerHTML='';if(STATE.view==='broad'){const assets=broadAssets();sb.classList.add('show');sb.innerHTML=`<button class="subpill ${STATE.broadKey==='CROSS'?'on':''}" onclick="setBroadAsset('CROSS')">Cross-Asset</button>`+assets.map(a=>`<button class="subpill ${STATE.broadKey===a.asset_key?'on':''}" onclick="setBroadAsset('${esc(a.asset_key)}')">${esc(a.display_group||a.market_group)} · ${esc(a.symbol)}</button>`).join('');if(STATE.broadKey!=='CROSS'){sec.classList.add('show');['overview','history','calendar','seasonality','drawdown'].forEach(x=>{const lab={overview:'Overview',history:'Now vs History',calendar:'Calendar + Monthly Heatmap',seasonality:'Seasonality',drawdown:'Drawdown'}[x];sec.innerHTML+=`<div class="sectab ${STATE.broadSection===x?'on':''}" onclick="setBroadSection('${x}')">${lab}</div>`})}}else if(STATE.view==='detail'){sb.classList.add('show');sb.innerHTML=STATE.groups.map(g=>`<button class="subpill ${STATE.group===g.market_group?'on':''}" onclick="setGroup('${esc(g.market_group)}')">${esc(groupName(g))}</button>`).join('')}}
function setView(v){STATE.view=v;STATE.filter='';if(v==='detail'&&(STATE.group==='ALL'||!STATE.groups.some(g=>g.market_group===STATE.group)))STATE.group=STATE.groups[0]?.market_group||'US';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));render()}function setGroup(g){STATE.group=g;STATE.filter='';render()}function setBroadAsset(k){STATE.broadKey=k;STATE.filter='';render()}function setBroadSection(s){STATE.broadSection=s;render()}function showBroadAsset(k){STATE.view='broad';STATE.broadKey=k;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view==='broad'));render()}document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)setView(t.dataset.view)});window.setGroup=setGroup;window.setBroadAsset=setBroadAsset;window.setBroadSection=setBroadSection;window.showBroadAsset=showBroadAsset;
function render(){renderSubbars();if(STATE.view==='pulse')renderPulse();if(STATE.view==='broad')renderBroad();if(STATE.view==='detail')renderDetail();if(STATE.view==='technical')renderTechnical()}
function renderPulse(){const all=summaries(STATE.items),ben=benchmarks();document.getElementById('app').innerHTML=`<div class="krow">${kpi('MTD avg',all.m,'All instruments','lb')}${kpi('YTD avg',all.y,'Close-based','lb')}${kpi(MONTHS[cm()]+' avg',all.ma,'Seasonality lens','lw')}${kpi('Avg annual',all.aa,'Historical annual','lg')}${kpi('Current DD',all.cd,'Average drawdown','ln')}${kpi('Breadth',`${all.pos}/${STATE.items.length}`,`${all.neg} negative`,all.pos>=all.neg?'lp':'ln',false)}</div><div class="pnl"><div class="ptl">All benchmark MTD/YTD snapshot <span>${ben.length} benchmarks</span></div>${benchmarkGrid(ben)}</div><div class="pulse-groups">${STATE.groups.map(groupPulse).join('')}</div>`}
function benchmarkGrid(items){return`<div class="grid g4">${items.map(i=>`<div class="card"><div class="card-h"><div><div class="card-title">${esc(i.display_group||i.market_group)}</div><div class="card-sub">${esc(i.symbol)} · Close ${money(close(i))}</div></div><span class="badge ${mtd(i)>=0?'bd':'br'}">MTD ${fmt(mtd(i))}</span></div><div class="metric-row"><div class="metric"><div class="ml">YTD</div><div class="mv ${cls(ytd(i))}">${fmt(ytd(i))}</div></div><div class="metric"><div class="ml">Cur DD</div><div class="mv ${cls(dd(i))}">${fmt(dd(i))}</div></div><div class="metric"><div class="ml">Signal</div><div class="mv">${zbadge(signal(i))}</div></div></div></div>`).join('')}</div>`}
function groupPulse(g){const items=g.items||[],s=summaries(items),b=groupBench(g);return`<div class="pulse-group"><div class="pg-hdr"><div><div class="pg-lbl">${esc(groupName(g))}</div><div class="pg-brd">Benchmark ${esc(b?.symbol||g.benchmark_symbol||'—')} · Close ${money(close(b||{}))} · MTD <span class="${cls(mtd(b||{}))}">${fmt(mtd(b||{}))}</span> · YTD <span class="${cls(ytd(b||{}))}">${fmt(ytd(b||{}))}</span></div></div><span class="badge ${s.m>=0?'bd':'br'}">Avg MTD ${fmt(s.m)}</span></div><div class="grid g2"><div><div class="ptl">Top 5 leaders</div><div class="tile-grid">${tiles(s.top.slice(0,5),'win')}</div></div><div><div class="ptl">Top 5 laggards</div><div class="tile-grid">${tiles(s.bot.slice(0,5),'lose')}</div></div></div></div>`}
function tiles(items,type){return items.length?items.map(i=>`<div class="tile ${type}"><div class="tile-nm">${esc(itemName(i))}</div><div class="tile-tk">${esc(i.symbol)}</div><div class="tile-ret ${cls(mtd(i))}">${fmt(mtd(i))}</div><div class="tile-price">Close ${money(close(i))}</div></div>`).join(''):'<div class="small">No data</div>'}
function selectedAsset(){return broadAssets().find(a=>a.asset_key===STATE.broadKey)||broadAssets()[0]}
function renderBroad(){if(STATE.broadKey==='CROSS')return renderCrossAsset();const i=selectedAsset();if(!i){document.getElementById('app').innerHTML='<div class="err">No broad market assets found.</div>';return}if(STATE.broadSection==='overview')renderBroadOverview(i);if(STATE.broadSection==='history')renderBroadHistory(i);if(STATE.broadSection==='calendar')renderBroadCalendar(i);if(STATE.broadSection==='seasonality')renderBroadSeasonality(i);if(STATE.broadSection==='drawdown')renderBroadDrawdown(i)}
function assetHero(i){return`<div class="now-banner"><div class="now-metric"><div class="now-label">${esc(i.display_group||i.market_group)}</div><div class="now-val">${esc(i.symbol)}</div><div class="now-sub">${esc(itemName(i))}</div></div><div class="now-div"></div><div class="now-metric"><div class="now-label">Close</div><div class="now-val">${money(close(i))}</div><div class="now-sub">latest price</div></div><div class="now-metric"><div class="now-label">MTD</div><div class="now-val ${cls(mtd(i))}">${fmt(mtd(i))}</div><div class="now-sub">current month</div></div><div class="now-metric"><div class="now-label">YTD</div><div class="now-val ${cls(ytd(i))}">${fmt(ytd(i))}</div><div class="now-sub">current year</div></div><div class="now-metric"><div class="now-label">Current DD</div><div class="now-val ${cls(dd(i))}">${fmt(dd(i))}</div><div class="now-sub">drawdown now</div></div></div>`}
function renderBroadOverview(i){document.getElementById('app').innerHTML=`${assetHero(i)}<div class="grid g3"><div class="pnl"><div class="ptl">Current metrics</div><div class="krow">${kpi('MTD',mtd(i),'Close-based','lb')}${kpi('YTD',ytd(i),'Close-based','lb')}${kpi(MONTHS[cm()]+' Avg',monthAvg(i),'Historical month','lw')}${kpi('Avg annual',avgAnnual(i),'Historical annual','lg')}${kpi('Current DD',dd(i),'Now','ln')}${kpi('Max DD',maxdd(i),'Worst historical','ln')}</div></div><div class="pnl"><div class="ptl">Now vs normal</div>${compareRows(i)}</div><div class="pnl"><div class="ptl">Signal / support snapshot</div>${supportTable([i])}</div></div><div class="pnl"><div class="ptl">Recent calendar + monthly heatmap</div>${singleCalendarHeatmap(i)}</div>`}
function compareRows(i){const pairs=[['MTD vs month avg',mtd(i),monthAvg(i)],['YTD vs avg annual',ytd(i),avgAnnual(i)],['Current DD vs Max DD',dd(i),maxdd(i)]];return pairs.map(p=>{const d=(num(p[1])!==null&&num(p[2])!==null)?num(p[1])-num(p[2]):null;return`<div class="bar-row"><div class="small"><b>${p[0]}</b></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.abs(d??0)*3+8)}%;background:${(d??0)>=0?'#16a34a':'#dc2626'}"></div></div><div class="mono ${cls(d)}">${fmt(d)}</div></div>`}).join('')}
function renderBroadHistory(i){document.getElementById('app').innerHTML=`${assetHero(i)}<div class="grid g2"><div class="pnl"><div class="ptl">Now vs history</div>${compareRows(i)}<div class="krow" style="margin-top:10px">${kpi('Current YTD',ytd(i),'vs historical avg','lb')}${kpi('Avg annual',avgAnnual(i),'Long-term','lg')}${kpi('Current MTD',mtd(i),'vs current month avg','lb')}${kpi(MONTHS[cm()]+' avg',monthAvg(i),'Seasonal','lw')}</div></div><div class="pnl"><div class="ptl">Recent annual returns</div>${yearCards(i)}</div></div>`}
function renderBroadCalendar(i){document.getElementById('app').innerHTML=`${assetHero(i)}<div class="pnl"><div class="ptl">Calendar year returns — recent years first</div>${yearCards(i)}</div><div class="pnl"><div class="ptl">Monthly heatmap — recent years first</div>${monthlyHeatmap([i],true)}</div>`}
function renderBroadSeasonality(i){document.getElementById('app').innerHTML=`${assetHero(i)}<div class="pnl"><div class="ptl">Monthly seasonality</div>${seasonalityGrid(i)}</div><div class="pnl"><div class="ptl">Current month context</div><div class="krow">${kpi('Current MTD',mtd(i),'Current month','lb')}${kpi(MONTHS[cm()]+' avg',monthAvg(i),'Historical average','lw')}${kpi('Positive rate',posRate(i),MONTHS[cm()]+' history','lg')}${kpi('MTD - Avg',(mtd(i)??0)-(monthAvg(i)??0),'Above/below normal','lb')}</div></div>`}
function renderBroadDrawdown(i){document.getElementById('app').innerHTML=`${assetHero(i)}<div class="grid g2"><div class="pnl"><div class="ptl">Drawdown profile</div><div class="krow">${kpi('Current DD',dd(i),'Now','ln')}${kpi('Max DD',maxdd(i),'Historical max','ln')}${kpi('MTD',mtd(i),'Momentum','lb')}${kpi('YTD',ytd(i),'Trend','lb')}</div></div><div class="pnl"><div class="ptl">Support / technical snapshot</div>${supportTable([i])}</div></div>`}
function renderCrossAsset(){const assets=broadAssets(),rows=assets.map(i=>({Asset:i.display_group||i.market_group,Symbol:i.symbol,Close:close(i),MTD:mtd(i),YTD:ytd(i),MonthAvg:monthAvg(i),AvgAnnual:avgAnnual(i),CurrentDD:dd(i),MaxDD:maxdd(i),Signal:signal(i),_item:i}));document.getElementById('app').innerHTML=`<div class="note">Cross-Asset compares broad benchmarks and major market instruments using live backend data. Close/price is preserved.</div><div class="pnl"><div class="ptl">Cross-Asset comparison <span>${rows.length} assets</span></div>${sortableTable(rows,'cross')}</div><div class="grid g2"><div class="pnl"><div class="ptl">YTD leaders</div>${miniRows([...assets].sort((a,b)=>(ytd(b)??-999)-(ytd(a)??-999)).slice(0,10),ytd)}</div><div class="pnl"><div class="ptl">MTD laggards</div>${miniRows([...assets].sort((a,b)=>(mtd(a)??999)-(mtd(b)??999)).slice(0,10),mtd)}</div></div><div class="pnl"><div class="ptl">Annual + monthly snapshot — broad assets</div>${monthlyHeatmap(assets.slice(0,30),false)}</div>`}
function miniRows(items,fn){return items.map(i=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #f3f4f6;padding:6px 0"><span><b>${esc(i.display_group||itemName(i))}</b> <span class="small mono">${esc(i.symbol)}</span> <span class="small">Close ${money(close(i))}</span></span><b class="${cls(fn(i))} mono">${fmt(fn(i))}</b></div>`).join('')||'<div class="small">No data available.</div>'}
function yearCards(i){const yrs=Object.keys(annualObj(i)).map(Number).filter(Boolean).sort((a,b)=>b-a);return`<div class="year-grid">${yrs.slice(0,28).map(y=>{const v=annual(i,y);return`<div class="year-card" style="${heatColor(v)}"><div class="yr">${y}</div><div class="rv">${fmt(v)}</div></div>`}).join('')||'<div class="small">No annual data.</div>'}</div>`}
function seasonalityGrid(i){return`<div class="seas-grid">${MONTHS.map((m,mi)=>{let v=num(get(i,[`seasonality.monthly_avg.${m.toLowerCase()}`,`seas.avg.${mi}`,`seasonality.avg.${mi}`]));if(v===null){const yrs=monthlyObj(i);v=avg(Object.keys(yrs).filter(y=>+y<cy()).map(y=>monthly(i,y,mi)))}return`<div class="seas-card"><div class="seas-m">${m}</div><div class="seas-v ${cls(v)}">${fmt(v)}</div><div class="small">${posRate(i,mi)!==null?fmt(posRate(i,mi),0):''}</div></div>`}).join('')}</div>`}
function singleCalendarHeatmap(i){return`<div class="grid g2"><div>${yearCards(i)}</div><div>${monthlyHeatmap([i],true)}</div></div>`}
function monthlyHeatmap(items,single=false){const years=single?Object.keys(monthlyObj(items[0]||{})).map(Number).filter(Boolean).sort((a,b)=>b-a).slice(0,16):[cy()];return`<div class="table-wrap"><table class="hm"><tr><th>${single?'Year':'Instrument'}</th>${single?'': '<th>Close</th><th>YTD</th>'}${MONTHS.map(m=>`<th>${m}</th>`).join('')}</tr>${single?years.map(y=>`<tr><td class="name">${y}</td>${MONTHS.map((m,mi)=>{const v=monthly(items[0],y,mi);return`<td style="${heatColor(v)}">${v===null?'—':fmt(v)}</td>`}).join('')}</tr>`).join(''):items.map(i=>`<tr><td class="name">${esc(i.symbol)}<div class="small">${esc(i.display_group||itemName(i)).slice(0,36)}</div></td><td>${money(close(i))}</td><td style="${heatColor(ytd(i))}">${fmt(ytd(i))}</td>${MONTHS.map((m,mi)=>{const v=monthly(i,cy(),mi),show=v??(mi===cm()?mtd(i):null);return`<td style="${heatColor(show)}">${show===null?'—':fmt(show)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function renderDetail(){const g=STATE.groups.find(x=>x.market_group===STATE.group)||STATE.groups[0],items=g?.items||[],bench=groupBench(g||{});const leaders=[...items].filter(i=>mtd(i)!==null).sort((a,b)=>mtd(b)-mtd(a)).slice(0,10),lags=[...items].filter(i=>mtd(i)!==null).sort((a,b)=>mtd(a)-mtd(b)).slice(0,10);const rows=items.map(i=>({Symbol:i.symbol,Name:itemName(i),Close:close(i),MTD:mtd(i),YTD:ytd(i),'MTD vs Benchmark':bench?(mtd(i)-mtd(bench)):null,MonthAvg:monthAvg(i),AvgAnnual:avgAnnual(i),CurrentDD:dd(i),Signal:signal(i),_item:i}));const s=summaries(items);document.getElementById('app').innerHTML=`<div class="intel"><div class="intel-l">${esc(groupName(g))} intelligence summary</div><div class="intel-t"><b>${esc(groupName(g))}</b> average MTD is <b class="${cls(s.m)}">${fmt(s.m)}</b> versus benchmark <b>${esc(bench?.symbol||'—')}</b> MTD <b class="${cls(mtd(bench||{}))}">${fmt(mtd(bench||{}))}</b>. Breadth is <b>${s.pos}/${items.length}</b> positive. Current average drawdown is <b class="${cls(s.cd)}">${fmt(s.cd)}</b>. Benchmark close: <b>${money(close(bench||{}))}</b>.</div></div><div class="grid g2"><div class="pnl"><div class="ptl">Top 10 leaders <span>Close + MTD</span></div>${leaderList(leaders,bench)}</div><div class="pnl"><div class="ptl">Top 10 laggards <span>Close + MTD</span></div>${leaderList(lags,bench)}</div></div><div class="pnl"><div class="ptl">Group instruments — returns, MTD vs benchmark, drawdown, zones</div>${controls('detail')}${sortableTable(rows,'detail')}</div><div class="pnl"><div class="ptl">Combined Annual + Monthly heatmap — ${esc(groupName(g))}</div>${monthlyHeatmap(items.slice(0,80),false)}</div><div class="grid g2"><div class="pnl"><div class="ptl">Drawdown analysis</div>${drawdownTable(items)}</div><div class="pnl"><div class="ptl">Support zones</div>${supportTable(items)}</div></div>`}
function leaderList(items,bench){return items.length?items.map((i,idx)=>{const rel=bench?(mtd(i)-mtd(bench)):null;return`<div style="display:grid;grid-template-columns:28px 1fr 76px 76px 82px;gap:8px;align-items:center;border-bottom:1px solid #f3f4f6;padding:6px 0"><b class="small">${idx+1}</b><span><b>${esc(itemName(i))}</b><br><span class="small mono">${esc(i.symbol)} · Close ${money(close(i))}</span></span><b class="mono ${cls(mtd(i))}">${fmt(mtd(i))}</b><span class="mono">${money(close(i))}</span><b class="mono ${cls(rel)}">${fmt(rel)}</b></div>`}).join(''):'<div class="small">No data available.</div>'}
function controls(scope){return`<div class="controls"><input class="search" placeholder="Filter symbol/name…" value="${esc(STATE.filter)}" oninput="STATE.filter=this.value;render()"></div>`}
function renderTechnical(){const groups=['ALL',...STATE.groups.map(g=>g.market_group)];let items=STATE.techGroup==='ALL'?STATE.items:STATE.items.filter(i=>i.market_group===STATE.techGroup);const rows=items.map(i=>({Group:i.market_group,Symbol:i.symbol,Name:itemName(i),Close:close(i),MTD:mtd(i),YTD:ytd(i),CurrentDD:dd(i),MaxDD:maxdd(i),Signal:signal(i),Pivot:level(i,'pivot'),S1:level(i,'s1'),S2:level(i,'s2'),R1:level(i,'r1'),R2:level(i,'r2'),CPR:cprText(i),_item:i}));const blanks=['Pivot','S1','S2','R1','R2'].reduce((a,c)=>a+rows.filter(r=>r[c]===null).length,0);const total=rows.length*5;document.getElementById('app').innerHTML=`${blanks/Math.max(total,1)>.65?'<div class="datawarn"><b>Data check:</b> Many technical levels are blank. Frontend now checks combined JSON and technical_summary.json fallbacks; remaining blanks likely mean backend export is missing those fields or uses a new field shape.</div>':''}<div class="pnl"><div class="ptl">Technical Analysis — one table, table-level filters <span>${rows.length} instruments</span></div><div class="controls"><select class="select" onchange="STATE.techGroup=this.value;STATE.filter='';render()">${groups.map(g=>`<option value="${esc(g)}" ${STATE.techGroup===g?'selected':''}>${esc(g==='ALL'?'All Markets':g)}</option>`).join('')}</select><select class="select" onchange="STATE.techTf=this.value;render()"><option value="weekly" ${STATE.techTf==='weekly'?'selected':''}>Weekly</option><option value="monthly" ${STATE.techTf==='monthly'?'selected':''}>Monthly</option><option value="annual" ${STATE.techTf==='annual'?'selected':''}>Annual</option></select><input class="search" placeholder="Filter symbol/name…" value="${esc(STATE.filter)}" oninput="STATE.filter=this.value;render()"></div>${sortableTable(rows,'technical')}</div>`}
function sortableTable(rows,key){const f=(STATE.filter||'').toLowerCase();if(f)rows=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(f)));const cols=Object.keys(rows[0]||{}).filter(c=>c!=='_item'),sort=STATE.sort[key]||{col:null,dir:1};if(sort.col)rows=[...rows].sort((a,b)=>{const av=a[sort.col],bv=b[sort.col],an=num(av),bn=num(bv);if(an!==null&&bn!==null)return(an-bn)*sort.dir;return String(av??'').localeCompare(String(bv??''))*sort.dir});return`<div class="table-wrap"><table><tr>${cols.map(c=>`<th onclick="sortTable('${key}','${esc(c)}')">${esc(c)} ${sort.col===c?(sort.dir>0?'▲':'▼'):''}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>cell(c,r[c])).join('')}</tr>`).join('')||'<tr><td>No rows</td></tr>'}</table></div>`}
function cell(c,v){if(c==='Signal')return`<td>${zbadge(v)}</td>`;if(['Close','Pivot','S1','S2','R1','R2'].includes(c))return`<td class="mono">${money(v)}</td>`;if(['MTD','YTD','MonthAvg','AvgAnnual','CurrentDD','MaxDD','DD','MTD vs Benchmark'].includes(c))return`<td class="${cls(v)} mono">${fmt(v)}</td>`;if(c==='Name'||c==='Symbol'||c==='Benchmark'||c==='Asset')return`<td class="sym ${c==='Name'||c==='Asset'?'':'mono'}">${esc(v)}</td>`;return`<td>${esc(v??'—')}</td>`}function sortTable(key,col){const s=STATE.sort[key]||{};STATE.sort[key]={col,dir:s.col===col?-(s.dir||1):-1};render()}window.sortTable=sortTable;
function drawdownTable(items){return sortableTable(items.map(i=>({Symbol:i.symbol,Name:itemName(i),Close:close(i),CurrentDD:dd(i),MaxDD:maxdd(i),MTD:mtd(i),YTD:ytd(i),_item:i})).sort((a,b)=>(a.CurrentDD??0)-(b.CurrentDD??0)).slice(0,30),'drawdown')}
function supportTable(items){return sortableTable(items.map(i=>({Symbol:i.symbol,Close:close(i),Signal:signal(i),Pivot:level(i,'pivot'),S1:level(i,'s1'),S2:level(i,'s2'),R1:level(i,'r1'),R2:level(i,'r2'),CPR:cprText(i),_item:i})).slice(0,50),'support')}
async function init(){try{const[data,last,tech]=await Promise.all([fetchFirst(DATA_PATHS),fetchFirst(LAST_PATHS,true),fetchFirst(TECH_PATHS,true)]);const n=norm(data);STATE.data=data;STATE.last=last;STATE.techRaw=tech;STATE.techMap=buildTechMap(tech);STATE.groups=n.groups;STATE.items=n.items;STATE.group=STATE.groups[0]?.market_group||'ALL';setUpdated();buildStrip();render()}catch(e){document.getElementById('app').innerHTML=`<div class="err"><b>Unable to load MarketPulse data.</b><br>${esc(e.message)}<br><br>Expected JSON paths: ${DATA_PATHS.join(', ')}</div>`}}init();
</script>
</body></html>
