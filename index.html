<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MarketPulse Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#f0f2f5;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px}.topbar{background:#111827;padding:0 16px;display:flex;align-items:stretch;justify-content:space-between;min-height:48px;gap:12px;position:sticky;top:0;z-index:20}.logo{font-size:16px;font-weight:900;color:#fff;letter-spacing:-.6px;display:flex;align-items:center;white-space:nowrap}.logo em{color:#60a5fa;font-style:normal}.mkt-strip{display:flex;align-items:stretch;overflow:auto;flex:1}.ms{padding:0 10px;border-left:1px solid #1e293b;display:flex;flex-direction:column;justify-content:center;min-width:84px;text-align:center}.ms-n{font-size:8px;color:#94a3b8;text-transform:uppercase;letter-spacing:.7px;font-weight:800;margin-bottom:2px}.ms-p{font-size:11px;font-weight:900;font-family:'Courier New',monospace;color:#e2e8f0}.ms-v{font-size:10px;font-weight:800;font-family:'Courier New',monospace}.p{color:#16a34a}.n{color:#dc2626}.z{color:#9ca3af}.upd{font-size:10px;color:#cbd5e1;background:#1f2937;padding:5px 9px;border-radius:5px;font-family:'Courier New',monospace;align-self:center;white-space:nowrap}.tabs{display:flex;background:#111827;padding:0 16px;border-top:1px solid #1f2937;border-bottom:1px solid #1f2937;overflow:auto;position:sticky;top:48px;z-index:19}.tab{padding:10px 18px;font-size:11px;font-weight:800;cursor:pointer;color:#9ca3af;border-bottom:3px solid transparent;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}.tab.on{color:#60a5fa;border-bottom-color:#60a5fa}.tab:hover{color:#fff}.subbar{display:flex;gap:6px;padding:9px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:89px;z-index:18;overflow:auto}.subpill{border:1.5px solid #e5e7eb;border-radius:999px;background:#fff;color:#6b7280;font-size:10px;font-weight:800;padding:6px 11px;cursor:pointer;white-space:nowrap}.subpill.on{background:#111827;color:#fff;border-color:#111827}.cnt{padding:14px 16px 24px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.pnl{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 1px rgba(15,23,42,.03)}.ptl{font-size:9px;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}.note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:8px;padding:9px 10px;font-size:11px;font-weight:650;line-height:1.45;margin-bottom:10px}.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;margin-bottom:10px}.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;border-left:4px solid #e5e7eb}.kpi.lp{border-left-color:#16a34a}.kpi.ln{border-left-color:#dc2626}.kpi.lb{border-left-color:#2563eb}.kpi.lw{border-left-color:#d97706}.kpi.lg{border-left-color:#6b7280}.kl{font-size:9px;color:#9ca3af;text-transform:uppercase;letter-spacing:.9px;margin-bottom:4px;font-weight:900}.kv{font-size:17px;font-weight:900;font-family:'Courier New',monospace;line-height:1.1}.ks{font-size:10px;color:#6b7280;margin-top:3px;line-height:1.35}.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:900;letter-spacing:.3px;background:#f3f4f6;color:#374151}.bd{background:#dcfce7;color:#166534}.br{background:#fee2e2;color:#991b1b}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}.card-title{font-size:13px;font-weight:900;letter-spacing:-.2px}.card-sub{font-size:10px;color:#6b7280;margin-top:2px;font-family:'Courier New',monospace}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.metric{background:#f9fafb;border:1px solid #f3f4f6;border-radius:7px;padding:7px}.ml{font-size:8px;color:#9ca3af;text-transform:uppercase;font-weight:900;letter-spacing:.6px}.mv{font-size:13px;font-family:'Courier New',monospace;font-weight:900;margin-top:2px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.search{border:1px solid #e5e7eb;border-radius:7px;padding:8px 10px;min-width:220px;font-size:12px}.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:8px;background:#fff}table{border-collapse:collapse;width:100%;font-size:11px}th{background:#f9fafb;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;font-size:9px;font-weight:900;text-align:right;padding:7px 8px;border-bottom:1px solid #e5e7eb;white-space:nowrap;cursor:pointer;position:sticky;top:0;z-index:1}th:first-child,td:first-child{text-align:left}td{padding:7px 8px;border-bottom:1px solid #f3f4f6;text-align:right;font-weight:650;white-space:nowrap}td.sym{text-align:left;font-weight:900;color:#111827}tr:hover td{background:#f9fafb}.heat-wrap{overflow:auto}.hm{border-collapse:separate;border-spacing:2px;width:100%;font-size:10px}.hm th{position:static;text-align:center;cursor:default;background:#fff;border:0;color:#9ca3af;padding:4px;font-size:9px}.hm th:first-child{text-align:left}.hm td{border:0;border-radius:3px;text-align:center;font-family:'Courier New',monospace;font-weight:900;min-width:42px;padding:5px 4px}.hm td.name{font-family:-apple-system,sans-serif;text-align:left;min-width:120px;background:#fff;color:#111827;font-weight:900}.zone{font-size:9px;font-weight:900;border-radius:4px;padding:3px 6px;display:inline-block}.zone.good{background:#dbeafe;color:#1e40af}.zone.better{background:#dcfce7;color:#166534}.zone.best{background:#d1fae5;color:#065f46}.zone.watch{background:#fef3c7;color:#92400e}.zone.risk{background:#ede9fe;color:#5b21b6}.zone.neutral{background:#f3f4f6;color:#4b5563}.zone.bad{background:#fee2e2;color:#991b1b}.small{font-size:10px;color:#6b7280}.mono{font-family:'Courier New',monospace}.footer{padding:16px;color:#6b7280;font-size:10px;text-align:center}.loading{padding:28px;text-align:center;color:#6b7280}.err{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;border-radius:10px;padding:14px;font-size:12px;line-height:1.5}@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.metric-row{grid-template-columns:repeat(2,1fr)}.topbar{flex-wrap:wrap;height:auto}.upd{margin:6px 0}.tabs{top:72px}.subbar{top:113px}.cnt{padding:10px}.mkt-strip{order:3;flex-basis:100%}.ms{min-width:96px}.search{min-width:100%;width:100%}}
</style>
</head>
<body>
<div class="topbar"><div class="logo">Market<em>Pulse</em></div><div class="mkt-strip" id="mktStrip"></div><div class="upd" id="updated">Loading…</div></div>
<div class="tabs" id="tabs"><div class="tab on" data-view="pulse">Pulse</div><div class="tab" data-view="broad">Broad Markets</div><div class="tab" data-view="detail">Detailed Group Analysis</div><div class="tab" data-view="technical">Technical Analysis</div></div>
<div class="subbar" id="subbar"></div><div class="cnt" id="app"><div class="loading">Loading MarketPulse JSON…</div></div><div class="footer">MarketPulse · close-based returns · technical analysis at the end</div>
<script>
const DATA_PATHS=['data/market_pulse_combined.json','./data/market_pulse_combined.json','market_pulse_combined.json','./market_pulse_combined.json'];
const LAST_PATHS=['data/last_updated.json','./data/last_updated.json','last_updated.json','./last_updated.json'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BENCH={US:'SPY',Canada:'XIC.TO',India:'^NSEI',Global:'ACWI',Gold:'GC=F',SilverMetals:'SI=F',CrudeOil:'CL=F',NaturalGas:'NG=F',Bonds:'TLT',Crypto:'BTC-USD'};
const BLOCKS=[{key:'ALL',label:'All Markets',groups:null},{key:'US',label:'US',groups:['US']},{key:'Canada',label:'Canada',groups:['Canada']},{key:'India',label:'India',groups:['India']},{key:'Global',label:'Global',groups:['Global']},{key:'Others',label:'Others',groups:['Gold','SilverMetals','CrudeOil','NaturalGas','Bonds','Crypto']}];
let STATE={data:null,last:null,groups:[],items:[],view:'pulse',group:'ALL',sort:{},filter:''};
async function fetchFirst(paths){let e;for(const p of paths){try{const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json();e=new Error(p+' '+r.status)}catch(x){e=x}}throw e||new Error('No JSON found')}
function num(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;const n=parseFloat(String(v).replace('%','').replace('+','').replace(',',''));return isFinite(n)?n:null}
function get(o,paths,f=null){for(const p of paths){let x=o;for(const k of p.split('.')){if(x&&Object.prototype.hasOwnProperty.call(x,k))x=x[k];else{x=undefined;break}}if(x!==undefined&&x!==null&&x!=='')return x}return f}
function fmt(v,d=1){const n=num(v);return n===null?'—':(n>=0?'+':'')+n.toFixed(d)+'%'}function money(v){const n=num(v);if(n===null)return'—';return n>=1000?n.toLocaleString(undefined,{maximumFractionDigits:0}):n.toLocaleString(undefined,{maximumFractionDigits:2})}function cls(v){const n=num(v);return n===null?'z':n>=0?'p':'n'}function avg(a){const x=a.map(num).filter(v=>v!==null);return x.length?x.reduce((p,c)=>p+c,0)/x.length:null}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cy(){return new Date().getFullYear()}function cm(){return new Date().getMonth()}function itemName(i){return i.name||i.display_name||i.symbol||'Unknown'}function groupName(g){return g.display_name||g.market_group||g.name||'Group'}
function ret(i,k){return num(get(i,[`returns.${k}`,`kpi.${k}`,k,`return_${k}`]))}function mtd(i){return ret(i,'mtd')??ret(i,'MTD')??ret(i,'mtd_pct')}function ytd(i){return ret(i,'ytd')??ret(i,'YTD')??ret(i,'ytd_pct')}function close(i){return num(get(i,['last_close','close','price','Current_Price']))}function dd(i){return num(get(i,['drawdown.current_drawdown','drawdown.current_dd','drawdown.curdd','curdd','drawdown.max_drawdown','maxdd']))}function maxdd(i){return num(get(i,['drawdown.max_drawdown','drawdown.maxdd','maxdd']))}function signal(i){return get(i,['signals.primary','signals.signal','signal','technicals.signal','zone'],'—')}function tech(i,k){return get(i,[`technicals.${k}`,`technical.${k}`,k])}function level(i,k){return num(get(i,[`technicals.levels.${k}`,`technicals.${k}`,`levels.${k}`,k.toUpperCase(),k]))}
function monthAvg(i){const mi=cm(),m=MONTHS[mi].toLowerCase();let v=num(get(i,[`seasonality.monthly_avg.${m}`,`seasonality.monthly_average.${m}`,`seasonality.avg_by_month.${m}`,`seasonality.current_month_avg`,`seasonality.selected_month_avg`,`seasonality.avg.${mi}`,`seas.avg.${mi}`]));if(v!==null)return v;const years=get(i,['monthly_returns_by_year','monthly'],null);if(years&&typeof years==='object'){return avg(Object.keys(years).filter(y=>+y<cy()).map(y=>{const r=years[y];return Array.isArray(r)?r[mi]:(r[MONTHS[mi]]??r[m]??r[String(mi+1)])}))}return null}
function avgAnnual(i){let v=num(get(i,['annual_return_stats.average','annual_return_stats.avg','annual_return_stats.mean','returns.avg_annual','avg_annual']));if(v!==null)return v;const y=get(i,['annual_returns_by_year','annual'],null);return y&&typeof y==='object'?avg(Object.values(y)):null}
function annual(i,yr){return num((get(i,['annual_returns_by_year','annual'],{})||{})[yr])}function monthly(i,yr,mi){const row=(get(i,['monthly_returns_by_year','monthly'],{})||{})[yr];if(!row)return null;return num(Array.isArray(row)?row[mi]:(row[MONTHS[mi]]??row[MONTHS[mi].toLowerCase()]??row[String(mi+1)]))}
function heatColor(v){const n=num(v);if(n===null)return'background:#f3f4f6;color:#9ca3af';const a=Math.min(Math.abs(n),12)/12;return n>=0?`background:rgba(22,163,74,${.12+a*.55});color:#14532d`:`background:rgba(220,38,38,${.12+a*.55});color:#7f1d1d`}
function zbadge(s){const x=String(s||'').toLowerCase();if(x.includes('best'))return'<span class="zone best">Best Buy</span>';if(x.includes('better'))return'<span class="zone better">Better Buy</span>';if(x.includes('good'))return'<span class="zone good">Good Buy</span>';if(x.includes('risk'))return'<span class="zone risk">Risk On</span>';if(x.includes('watch'))return'<span class="zone watch">Watch</span>';if(x.includes('below')||x.includes('weak'))return'<span class="zone bad">'+esc(s)+'</span>';return'<span class="zone neutral">'+esc(s||'—')+'</span>'}
function norm(d){const groups=(d.groups||[]).map(g=>({...g,market_group:g.market_group||g.name||g.display_name}));const items=[];groups.forEach(g=>(g.items||[]).forEach(it=>items.push({...it,market_group:g.market_group,group_display_name:groupName(g),group_benchmark_symbol:g.benchmark_symbol||BENCH[g.market_group]})));return{groups,items}}
function setUpdated(){const ts=STATE.last?.generated_at||STATE.data?.generated_at,count=STATE.last?.universe_count||STATE.data?.universe_count||STATE.items.length;document.getElementById('updated').textContent=ts?`Updated ${ts.replace('T',' ').replace('+00:00',' UTC')} · ${count} items`:`${count} items`}
function buildStrip(){const benches=benchmarks();document.getElementById('mktStrip').innerHTML=benches.map(b=>`<div class="ms" onclick="showBroad('${esc(b.market_group)}')"><div class="ms-n">${esc(b.display_group||b.market_group)}</div><div class="ms-p">${money(close(b))}</div><div class="ms-v ${cls(mtd(b))}">${fmt(mtd(b))}</div></div>`).join('')}
function itemsFor(groups){return !groups?STATE.items:STATE.items.filter(i=>groups.includes(i.market_group))}function summaries(items){return{m:avg(items.map(mtd)),y:avg(items.map(ytd)),ma:avg(items.map(monthAvg)),aa:avg(items.map(avgAnnual)),cd:avg(items.map(dd)),pos:items.filter(i=>num(mtd(i))>=0).length,neg:items.filter(i=>num(mtd(i))<0).length,top:[...items].filter(i=>mtd(i)!==null).sort((a,b)=>mtd(b)-mtd(a)).slice(0,2),bot:[...items].filter(i=>mtd(i)!==null).sort((a,b)=>mtd(a)-mtd(b)).slice(0,2)}}
function kpi(label,val,sub='',type='lg',pct=true){return`<div class="kpi ${type}"><div class="kl">${label}</div><div class="kv ${pct?cls(val):''}">${pct?fmt(val):esc(val)}</div>${sub?`<div class="ks">${sub}</div>`:''}</div>`}
function renderSubbar(){const sb=document.getElementById('subbar');if(STATE.view==='detail')sb.innerHTML=STATE.groups.map(g=>`<button class="subpill ${STATE.group===g.market_group?'on':''}" onclick="setGroup('${esc(g.market_group)}')">${esc(groupName(g))}</button>`).join('');else sb.innerHTML=BLOCKS.map(b=>`<button class="subpill ${STATE.group===b.key?'on':''}" onclick="setGroup('${b.key}')">${b.label}</button>`).join('')}
function setView(v){STATE.view=v;if(v==='detail'&&(STATE.group==='ALL'||STATE.group==='Others'))STATE.group=STATE.groups[0]?.market_group||'US';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));render()}function setGroup(g){STATE.group=g;render()}function showBroad(g){STATE.view='broad';STATE.group=g;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view==='broad'));render()}document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)setView(t.dataset.view)});window.setGroup=setGroup;window.showBroad=showBroad;
function render(){renderSubbar();if(STATE.view==='pulse')renderPulse();if(STATE.view==='broad')renderBroad();if(STATE.view==='detail')renderDetail();if(STATE.view==='technical')renderTechnical()}
function renderPulse(){const all=summaries(STATE.items),cur=BLOCKS.find(b=>b.key===STATE.group)||BLOCKS[0],items=itemsFor(cur.groups),s=summaries(items);document.getElementById('app').innerHTML=`<div class="krow">${kpi('MTD avg',all.m,'All instruments','lb')}${kpi('YTD avg',all.y,'Close-based','lb')}${kpi(MONTHS[cm()]+' avg',all.ma,'Seasonality lens','lw')}${kpi('Avg annual',all.aa,'Historical annual','lg')}${kpi('Current DD',all.cd,'Average drawdown','ln')}${kpi('Breadth',`${all.pos}/${STATE.items.length}`,`${all.neg} negative`,all.pos>=all.neg?'lp':'ln',false)}</div><div class="grid g3" style="margin-bottom:10px">${BLOCKS.map(pulseBlock).join('')}</div><div class="pnl"><div class="ptl">Pulse summary — ${esc(cur.label)} <span>${items.length} instruments</span></div><div class="krow">${kpi('MTD',s.m,'Average current month','lb')}${kpi('YTD',s.y,'Average current year','lb')}${kpi(MONTHS[cm()]+' avg',s.ma,'Seasonality','lw')}${kpi('Avg annual',s.aa,'Annual average','lg')}${kpi('Current DD',s.cd,'Drawdown now','ln')}${kpi('Breadth',`${s.pos}/${items.length}`,`${s.neg} negative`,s.pos>=s.neg?'lp':'ln',false)}</div><div class="grid g2"><div class="card"><div class="ptl">MTD leaders</div>${mini(s.top)}</div><div class="card"><div class="ptl">MTD laggards</div>${mini(s.bot)}</div></div></div>`}
function pulseBlock(b){const items=itemsFor(b.groups),s=summaries(items);return`<div class="card" onclick="setGroup('${b.key}')" style="cursor:pointer;border-color:${STATE.group===b.key?'#2563eb':'#e5e7eb'}"><div class="card-h"><div><div class="card-title">${b.label}</div><div class="card-sub">${items.length} instruments</div></div><span class="badge ${s.m>=0?'bd':'br'}">${fmt(s.m)}</span></div><div class="metric-row"><div class="metric"><div class="ml">YTD</div><div class="mv ${cls(s.y)}">${fmt(s.y)}</div></div><div class="metric"><div class="ml">${MONTHS[cm()]} Avg</div><div class="mv ${cls(s.ma)}">${fmt(s.ma)}</div></div><div class="metric"><div class="ml">Cur DD</div><div class="mv ${cls(s.cd)}">${fmt(s.cd)}</div></div></div></div>`}
function mini(items){return items.length?items.map(i=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #f3f4f6;padding:6px 0"><span><b>${esc(itemName(i))}</b> <span class="small mono">${esc(i.symbol)}</span></span><b class="${cls(mtd(i))} mono">${fmt(mtd(i))}</b></div>`).join(''):'<div class="small">No data available.</div>'}
function benchmarks(){return STATE.groups.map(g=>{const sym=g.benchmark_symbol||BENCH[g.market_group],b=(g.items||[]).find(i=>String(i.symbol)===String(sym))||(g.items||[]).find(i=>String(i.role).toLowerCase()==='benchmark')||(g.items||[])[0];return b?{...b,display_group:groupName(g)}:null}).filter(Boolean)}
function renderBroad(){const bs=benchmarks(),fil=STATE.group==='ALL'?bs:bs.filter(i=>STATE.group==='Others'?BLOCKS.find(b=>b.key==='Others').groups.includes(i.market_group):i.market_group===STATE.group),rows=fil.map(i=>({Group:i.display_group||i.market_group,Benchmark:i.symbol,Close:close(i),MTD:mtd(i),YTD:ytd(i),MonthAvg:monthAvg(i),AvgAnnual:avgAnnual(i),CurrentDD:dd(i),Signal:signal(i),_item:i}));document.getElementById('app').innerHTML=`<div class="note">Broad Markets shows benchmark instruments only. Current month uses latest close-based MTD; Month Avg is the seasonal average for the current calendar month where available.</div><div class="pnl"><div class="ptl">Broad benchmark table <span>${rows.length} groups</span></div>${sortableTable(rows,'broad')}</div><div class="pnl"><div class="ptl">Combined Annual + Monthly heatmap — benchmarks</div>${heatmap(fil,'benchmark')}</div><div class="grid g2"><div class="pnl"><div class="ptl">Benchmark drawdown</div>${drawdownTable(fil)}</div><div class="pnl"><div class="ptl">Support zone summary</div>${supportTable(fil)}</div></div>`}
function renderDetail(){const g=STATE.groups.find(x=>x.market_group===STATE.group)||STATE.groups[0],items=g?.items||[],bench=items.find(i=>String(i.symbol)===String(g.benchmark_symbol||BENCH[g.market_group]))||items.find(i=>String(i.role).toLowerCase()==='benchmark')||items[0];const rows=items.map(i=>({Symbol:i.symbol,Name:itemName(i),Close:close(i),MTD:mtd(i),YTD:ytd(i),Rel:bench?(mtd(i)-mtd(bench)):null,MonthAvg:monthAvg(i),AvgAnnual:avgAnnual(i),CurrentDD:dd(i),Signal:signal(i),_item:i}));document.getElementById('app').innerHTML=`<div class="pnl"><div class="ptl">${esc(groupName(g))} group dashboard <span>Benchmark ${esc(g.benchmark_symbol||bench?.symbol||'—')}</span></div><div class="krow">${kpi('Group MTD',avg(items.map(mtd)),'Average','lb')}${kpi('Group YTD',avg(items.map(ytd)),'Average','lb')}${kpi('Benchmark MTD',bench?mtd(bench):null,bench?bench.symbol:'—','lg')}${kpi('Current DD',avg(items.map(dd)),'Average','ln')}</div></div><div class="pnl"><div class="ptl">Group instruments — relative strength, returns, drawdown, zones</div>${controls()}${sortableTable(rows,'detail')}</div><div class="pnl"><div class="ptl">Combined Annual + Monthly heatmap — ${esc(groupName(g))}</div>${heatmap(items,'detail')}</div><div class="grid g2"><div class="pnl"><div class="ptl">Drawdown analysis</div>${drawdownTable(items)}</div><div class="pnl"><div class="ptl">Support zones</div>${supportTable(items)}</div></div>`}
function controls(){return`<div class="controls"><input class="search" placeholder="Filter symbol/name…" value="${esc(STATE.filter)}" oninput="STATE.filter=this.value;render()"></div>`}
function renderTechnical(){const rows=STATE.items.map(i=>({Group:i.market_group,Symbol:i.symbol,Name:itemName(i),Close:close(i),Signal:signal(i),Pivot:level(i,'pivot'),S1:level(i,'s1'),S2:level(i,'s2'),R1:level(i,'r1'),R2:level(i,'r2'),CPR:tech(i,'cpr_position')||tech(i,'position')||'—',DD:dd(i),MTD:mtd(i),YTD:ytd(i),_item:i}));document.getElementById('app').innerHTML=`<div class="note">Technical Analysis is intentionally placed at the end. It uses backend technical fields where available and shows fallbacks where fields are missing.</div><div class="pnl"><div class="ptl">Technical Analysis — all instruments</div>${controls()}${sortableTable(rows,'technical')}</div>`}
function sortableTable(rows,key){const f=(STATE.filter||'').toLowerCase();if(f)rows=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(f)));const cols=Object.keys(rows[0]||{}).filter(c=>c!=='_item'),sort=STATE.sort[key]||{col:null,dir:1};if(sort.col)rows=[...rows].sort((a,b)=>{const av=a[sort.col],bv=b[sort.col],an=num(av),bn=num(bv);if(an!==null&&bn!==null)return(an-bn)*sort.dir;return String(av??'').localeCompare(String(bv??''))*sort.dir});return`<div class="table-wrap"><table><tr>${cols.map(c=>`<th onclick="sortTable('${key}','${c}')">${esc(c)} ${sort.col===c?(sort.dir>0?'▲':'▼'):''}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>cell(c,r[c])).join('')}</tr>`).join('')||'<tr><td>No rows</td></tr>'}</table></div>`}
function cell(c,v){if(c==='Signal')return`<td>${zbadge(v)}</td>`;if(['Close','Pivot','S1','S2','R1','R2'].includes(c))return`<td class="mono">${money(v)}</td>`;if(['MTD','YTD','MonthAvg','AvgAnnual','CurrentDD','DD','Rel'].includes(c))return`<td class="${cls(v)} mono">${fmt(v)}</td>`;if(c==='Name'||c==='Symbol'||c==='Benchmark')return`<td class="sym ${c==='Name'?'':'mono'}">${esc(v)}</td>`;return`<td>${esc(v??'—')}</td>`}function sortTable(key,col){const s=STATE.sort[key]||{};STATE.sort[key]={col,dir:s.col===col?-(s.dir||1):-1};render()}window.sortTable=sortTable;
function heatmap(items,key){const yr=cy();return`<div class="heat-wrap"><table class="hm"><tr><th>Instrument</th><th>Avg Annual</th><th>YTD</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}</tr>${items.slice(0,key==='detail'?80:20).map(i=>`<tr><td class="name">${esc(i.symbol)}<div class="small">${esc(itemName(i)).slice(0,34)}</div></td><td style="${heatColor(avgAnnual(i))}">${fmt(avgAnnual(i))}</td><td style="${heatColor(ytd(i))}">${fmt(ytd(i))}</td>${MONTHS.map((m,mi)=>{const v=monthly(i,yr,mi),show=v??(mi===cm()?mtd(i):null);return`<td style="${heatColor(show)}">${show===null?'—':fmt(show)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function drawdownTable(items){return sortableTable(items.map(i=>({Symbol:i.symbol,Name:itemName(i),CurrentDD:dd(i),MaxDD:maxdd(i),MTD:mtd(i),YTD:ytd(i),_item:i})).sort((a,b)=>(a.CurrentDD??0)-(b.CurrentDD??0)).slice(0,24),'drawdown')}
function supportTable(items){return sortableTable(items.map(i=>({Symbol:i.symbol,Close:close(i),Signal:signal(i),Pivot:level(i,'pivot'),S1:level(i,'s1'),S2:level(i,'s2'),CPR:tech(i,'cpr_position')||tech(i,'position')||'—',_item:i})).slice(0,40),'support')}
async function init(){try{const[data,last]=await Promise.all([fetchFirst(DATA_PATHS),fetchFirst(LAST_PATHS).catch(()=>null)]);const n=norm(data);STATE.data=data;STATE.last=last;STATE.groups=n.groups;STATE.items=n.items;setUpdated();buildStrip();render()}catch(e){document.getElementById('app').innerHTML=`<div class="err"><b>Unable to load MarketPulse data.</b><br>${esc(e.message)}<br><br>Expected JSON paths: ${DATA_PATHS.join(', ')}</div>`}}init();
</script>
</body></html>
