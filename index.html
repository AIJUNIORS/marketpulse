const MKTS_TK={'returns_GSPC':'SP','returns_IXIC':'NQ','returns_GSPTSE':'TSX',

function safeTk(t){return t.replace(/\^/g,'').replace(/=/g,'').replace(/\./g,'_');}

// ── JS HELPERS ───────────────────────────────────────────────────────────────
function safeNum(v){const n=parseFloat(v);return isNaN(n)?null:n;}

function fmtPrice(v,decimals){
  const n=safeNum(v);
  if(n===null)return'—';
  const d=decimals!==undefined?decimals:(n>500?0:n>50?2:n>1?2:4);
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}

function fmtChg(chg,pct){
  const c=safeNum(chg),p=safeNum(pct);
  if(c===null&&p===null)return{txt:'—',cls:''};
  const sign=c>=0?'+':'';
  const cStr=c!==null?`${sign}${fmtPrice(c)}`:'';
  const pStr=p!==null?`(${p>=0?'+':''}${p.toFixed(2)}%)`:'';
  return{txt:`${cStr} ${pStr}`.trim(),cls:c>=0?'p':'n'};
}

function zoneColour(zone){
  const map={watch:'watch',good:'good',better:'better',best:'best',above:'above'};
  return map[zone]||'above';
}


function firstSafeNum(...vals){
  for(const v of vals){
    const n=safeNum(v);
    if(n!==null) return n;
  }
  return null;
}

function firstDefined(...vals){
  for(const v of vals){
    if(v!==undefined&&v!==null&&v!=='') return v;
  }
  return null;
}

function mergePriceLayer(target,d){
  const k=d.kpi||{};
  const price=firstSafeNum(d.price,d.last_close,d.close,d.current_price,d.current,d.nav,k.price,k.last_close,k.close,k.current_price,k.current,k.nav);

  if(dailyChange!==null) target.daily_change=dailyChange;
  const dailyPct=firstSafeNum(d.daily_change_pct,d.change_pct,d.percent_change,d.day_change_pct,k.daily_change_pct,k.change_pct,k.percent_change,k.day_change_pct);
  if(dailyPct!==null) target.daily_change_pct=dailyPct;
  const ma50=firstSafeNum(d.ma50,d.sma50,d.ma_50,d.moving_average_50,k.ma50,k.sma50,k.ma_50,k.moving_average_50);
  if(ma50!==null) target.ma50=ma50;
  const ma200=firstSafeNum(d.ma200,d.sma200,d.ma_200,d.moving_average_200,k.ma200,k.sma200,k.ma_200,k.moving_average_200);

  if(high52!==null) target.week52_high=high52;
  const low52=firstSafeNum(d.week52_low,d.low52,d.fifty_two_week_low,d['52w_low'],k.week52_low,k.low52,k.fifty_two_week_low,k['52w_low']);

function pct(v){return(parseFloat(v)>=0?'+':'')+parseFloat(v).toFixed(1)+'%';}
function pc(v){return parseFloat(v)>=0?'pos':'neg';}
function lc(v){const n=parseFloat(v);return n>=0?'lp':n<0?'ln':'lg';}
function hc(v){
  if(v===0)return{bg:'#f9fafb',tc:'#9ca3af'};
  const i=Math.min(Math.abs(v)/12,1);
  return v>0?{bg:`rgba(22,163,74,${.07+i*.42})`,tc:i>0.6?'#14532d':'#166534'}
            :{bg:`rgba(220,38,38,${.07+i*.42})`,tc:i>0.6?'#7f1d1d':'#991b1b'};
}

function buyZoneCard(item){

  if(!bz||(!bz.watch&&!bz.good&&!bz.better&&!bz.best))return'';
  const zones=[
    {key:'watch',label:'Watch',desc:'Near support — start watching'},
    {key:'good', label:'Good', desc:'First entry — partial position'},
    {key:'better',label:'Better',desc:'Add on dip — better risk/reward'},

  ];
  const activeZone=zoneColour(z);
  const prices=zones.map(zn=>safeNum(bz[zn.key])).filter(v=>v!==null);
  const minZ=prices.length?Math.min(...prices):null;

function maCard(item){
  const p=item.price,ma50=item.ma50,ma200=item.ma200;
  const hi=item.week52_high,lo=item.week52_low;
  if(!p||(!hi&&!lo&&!ma50&&!ma200))return'';
  const rangeMin=lo||Math.min(...[p,ma50,ma200].filter(Boolean))*0.92;
  const rangeMax=hi||Math.max(...[p,ma50,ma200].filter(Boolean))*1.08;
  const span=rangeMax-rangeMin||1;
  function pos(v){return Math.max(2,Math.min(98,((v-rangeMin)/span*100)));}
  const pPos=pos(p);
  const ma50Pos=ma50?pos(ma50):null;
  const ma200Pos=ma200?pos(ma200):null;
  const aboveMa50=ma50&&p>ma50,aboveMa200=ma200&&p>ma200;
  return`<div class="ma-card">

      <span>${hi?fmtPrice(hi):'—'} 52W Hi</span>

        <div class="ma-marker-line" style="background:#2563eb"></div>
      </div>`:''}
      <div class="price-marker" style="left:${pPos}%"></div>
    </div>
    <div class="chips" style="margin-top:4px">
      ${ma50?`<div class="chip" style="border-left:2px solid #2563eb">
        <span class="cl">vs MA50</span>
        <b style="color:${aboveMa50?'#15803d':'#991b1b'}">${aboveMa50?'Above':'Below'} ${Math.abs((p-ma50)/ma50*100).toFixed(1)}%</b>
      </div>`:''}
      ${ma200?`<div class="chip" style="border-left:2px solid #7c3aed">
        <span class="cl">vs MA200</span>
        <b style="color:${aboveMa200?'#15803d':'#991b1b'}">${aboveMa200?'Above':'Below'} ${Math.abs((p-ma200)/ma200*100).toFixed(1)}%</b>
      </div>`:''}
      ${hi?`<div class="chip"><span class="cl">From 52W Hi</span><b class="neg">${((p-hi)/hi*100).toFixed(1)}%</b></div>`:''}
      ${lo?`<div class="chip"><span class="cl">From 52W Lo</span><b class="pos">+${((p-lo)/lo*100).toFixed(1)}%</b></div>`:''}
    </div>
  </div>`;
}

function renderPulse(){
  document.getElementById('atabs').innerHTML='';
  document.getElementById('stabs').innerHTML='';
  if(!window.grpPeriod) window.grpPeriod={0:'ytd',1:'ytd',2:'ytd',3:'ytd'};
  function gv(item,p){
    if(p==='ytd')return item.kpi?parseFloat(item.kpi.ytd):item.ytd||0;
    if(p==='mtd')return item.kpi?parseFloat(item.kpi.mtd)||parseFloat(item.kpi.r1m):item.r1m||0;
    if(p==='r1y')return item.kpi?parseFloat(item.kpi.r1y):item.r1y||0;
    return 0;
  }
  function avg(arr){return arr.length?parseFloat((arr.reduce((s,v)=>s+v,0)/arr.length).toFixed(1)):0;}
  function buildGroup(g,gi){
    const p=window.grpPeriod[gi]||'ytd';
    const periods=['mtd','ytd','r1y'];
    const labels={mtd:'MTD',ytd:'YTD',r1y:'1Y'};
    const vals=periods.map(pp=>avg(g.items.map(it=>gv(it,pp))));
    const pos=g.items.filter(it=>gv(it,p)>0).length;
    const best=g.items.reduce((b,it)=>gv(it,p)>gv(b,p)?it:b,g.items[0]);
    const worst=g.items.reduce((w,it)=>gv(it,p)<gv(w,p)?it:w,g.items[0]);
    const mxA=Math.max(...g.items.map(it=>Math.abs(gv(it,p))),0.1);
    const summary=`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0 7px;border-bottom:1px solid #f3f4f6;margin-bottom:7px;flex-wrap:wrap;gap:4px">
      <div style="display:flex;gap:5px;align-items:center">
        ${periods.map((pp,i)=>`<div onclick="setGrpPeriod(${gi},'${pp}')" style="text-align:center;padding:3px 7px;border-radius:4px;cursor:pointer;background:${pp===p?'#111827':'#f9fafb'};border:1px solid ${pp===p?'#374151':'#e5e7eb'}">
          <div style="font-size:8px;color:${pp===p?'#60a5fa':'#9ca3af'};font-weight:700;text-transform:uppercase;letter-spacing:.4px">${labels[pp]}</div>
          <div style="font-size:11px;font-weight:800;font-family:'Courier New',monospace;color:${vals[i]>=0?(pp===p?'#4ade80':'#16a34a'):(pp===p?'#f87171':'#dc2626')}">${vals[i]>=0?'+':''}${vals[i]}%</div>
        </div>`).join('')}
      </div>
      <div style="font-size:9px;color:#9ca3af">
        <span style="color:#6b7280;font-weight:600">${pos}/${g.items.length} +ve</span>
        <span style="margin:0 3px;color:#e5e7eb">|</span>
        <span style="color:#16a34a">↑${best.label||best.name} ${gv(best,p)>=0?'+':''}${gv(best,p).toFixed(1)}%</span>
        <span style="margin:0 3px;color:#e5e7eb">·</span>
        <span style="color:#dc2626">↓${worst.label||worst.name} ${gv(worst,p).toFixed(1)}%</span>
      </div>
    </div>`;
    const tiles=g.items.map(item=>{
      const v=gv(item,p);const{bg,tc}=hc(v);const rc=item.rc||item.type||'m';
      const rcB={c:'bc',d:'bd',h:'bh',cy:'bcy',v:'bv',m:'bm'}[rc]||'bm';
      const hasPrice=item.price!==null&&item.price!==undefined;
      const{txt:chgTxt,cls:chgCls}=hasPrice?fmtChg(item.daily_change,item.daily_change_pct):{txt:'',cls:''};
      const zBadge=item.zone?`<span class="zone-badge ${zoneColour(item.zone)}">${item.zone}</span>`:'';
      return`<div class="tile" style="background:${bg};border-color:${v>0?'rgba(22,163,74,.2)':'rgba(220,38,38,.2)'}"
        onclick="openTile('${(item.label||item.name).replace(/'/g,"\\'")}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div><div class="tile-nm" style="color:${tc}">${item.label||item.name}</div>
          <div class="tile-tk">${item.tk||''}</div></div>
          <span class="badge ${rcB}" style="font-size:8px">${rc.toUpperCase().slice(0,3)}</span>
        </div>
        ${hasPrice?`<div class="tile-price">${fmtPrice(item.price)}</div>`:''}
        ${hasPrice&&chgTxt?`<div class="tile-chg ${chgCls}">${chgTxt}</div>`:''}
        <div class="tile-ret" style="color:${tc}">${v>=0?'+':''}${v.toFixed(1)}%</div>
        <div class="tile-dd" style="color:${tc}">DD ${item.kpi?item.kpi.curdd||item.kpi.maxdd:item.maxdd||0}%</div>
        ${zBadge}
      </div>`;
    }).join('');
    return`<div class="pulse-group" id="pg${gi}">
      <div style="font-size:9px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px">${g.lbl}</div>
      ${summary}
      <div class="tile-grid" style="grid-template-columns:${g.cols}">${tiles}</div>
    </div>`;
  }
  const groups=[
    {lbl:'Global Markets',items:Object.values(MKTS),cols:'repeat(4,1fr)'},
    {lbl:'US Sectors & Macro',items:SECTS.US.sectors,cols:'repeat(4,1fr)'},
    {lbl:'India Sectors & Macro',items:SECTS.INDIA.sectors,cols:'repeat(4,1fr)'},
    {lbl:'TSX Sectors & Macro',items:SECTS.TSX.sectors,cols:'repeat(4,1fr)'}
  ];
  document.getElementById('cnt').innerHTML=`<div style="padding:10px 0">
    <div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:8px">
      ${groups.reduce((s,g)=>s+g.items.length,0)} instruments · each group has independent MTD / YTD / 1Y switcher
    </div>
    <div class="pulse-groups">${groups.map((g,gi)=>buildGroup(g,gi)).join('')}</div>
  </div>`;
}

// ── buildHM ──────────────────────────────────────────────────────────────────
function buildHM(monthly,years){
  let h=`<table class="hm"><thead><tr><th class="yl">Year</th>${MO.map(m=>`<th>${m}</th>`).join('')}<th style="background:#f3f4f6">Total</th></tr></thead><tbody>`;
  years.forEach(yr=>{
    const row=monthly[yr];if(!row)return;
    const tot=row.slice(0,yr===TODAY_YR?TODAY_MO:12).reduce((s,v)=>s+v,0);
    h+=`<tr><td class="yl">${yr}</td>`;
    row.forEach((v,mi)=>{
      if(yr===TODAY_YR&&mi>=TODAY_MO){h+=`<td style="color:#d1d5db;font-size:8px">·</td>`;return;}
      const{bg,tc}=hc(v);
      h+=`<td style="background:${bg};color:${tc}">${v>=0?'+':''}${v.toFixed(1)}</td>`;
    });
    h+=`<td style="color:${tot>=0?'#14532d':'#7f1d1d'};font-weight:800;background:${tot>=0?'#dcfce7':'#fee2e2'};border-radius:3px">${tot>=0?'+':''}${tot.toFixed(1)}</td></tr>`;
  });
  return h+`</tbody></table>`;
}

// ── nowBanner ─────────────────────────────────────────────────────────────────
function nowBanner(D){
  const ytd=parseFloat(D.kpi.ytd),mtd=parseFloat(D.kpi.mtd);
  const seasMo=D.seas.avg[TODAY_MO],seasWk=D.seas.wkAvg[TODAY_MO];
  const seasMo5=(D.seas.avg5||D.seas.avg)[TODAY_MO],seasWk5=(D.seas.wkAvg5||D.seas.wkAvg)[TODAY_MO];
  const allVals=Object.values(D.annual);
  const rank=Math.round(allVals.filter(v=>v<ytd).length/allVals.length*100);
  const moVals=Object.keys(D.monthly).filter(y=>parseInt(y)<TODAY_YR).map(y=>D.monthly[y][TODAY_MO]).filter(v=>Math.abs(v)>0);
  const moAbove=mtd>seasMo5;const wkAbove=seasWk5>=0;
  const seasNext=D.seas.avg[(TODAY_MO+1)%12];
  const seasNext5=(D.seas.avg5||D.seas.avg)[(TODAY_MO+1)%12];
  const moPos=Math.max(0,Math.min(100,(ytd-Math.min(...allVals))/(Math.max(...allVals)-Math.min(...allVals))*100));
  const verdictParts=[];
  if(rank>65)verdictParts.push(`<b>${D.label}</b> YTD ${D.kpi.ytd}% — top-tercile year, <b>${rank}th percentile</b> historically at this calendar point`);
  else if(rank<35)verdictParts.push(`<b>${D.label}</b> YTD ${D.kpi.ytd}% — below-average year, <b>${rank}th percentile</b> historically`);
  else verdictParts.push(`<b>${D.label}</b> YTD ${D.kpi.ytd}% — tracking near historical average`);
  if(moAbove)verdictParts.push(`${MO_NAME} running <b>above seasonal norm</b> (MTD ${D.kpi.mtd}% vs 5yr ${pct(seasMo5)} · 20yr ${pct(seasMo)}, +ve ${D.seas.posRate[TODAY_MO]}% of years)`);
  else verdictParts.push(`${MO_NAME} running <b>below seasonal norm</b> (MTD ${D.kpi.mtd}% vs 5yr ${pct(seasMo5)} · 20yr ${pct(seasMo)})`);
  if(seasNext5<-0.5)verdictParts.push(`seasonal <b>headwind</b> in ${MO_NEXT} (5yr ${pct(seasNext5)} · 20yr ${pct(seasNext)})`);
  else if(seasNext5>0.5)verdictParts.push(`seasonal <b>tailwind</b> in ${MO_NEXT} (5yr ${pct(seasNext5)} · 20yr ${pct(seasNext)})`);
  const curDD=parseFloat(D.kpi.curdd);
  if(curDD<-10)verdictParts.push(`<b>${Math.abs(curDD).toFixed(1)}% below peak</b>`);
  else if(curDD>=0)verdictParts.push(`<b>at or near all-time high</b>`);
  return`<div class="verdict-card"><div class="verdict-label">Intelligence · ${D.label} · ${MO_NAME} ${TODAY_YR}</div>
    <div class="verdict-text">${verdictParts.join(' · ')}</div></div>
  <div class="now-banner">
    <div class="now-metric"><div class="now-label">YTD</div><div class="now-val" style="color:${ytd>=0?'#60a5fa':'#f87171'}">${D.kpi.ytd}%</div><div class="now-sub" style="color:#6b7280">${rank}th pctl</div></div>
    <div class="now-div"></div>
    <div class="now-metric"><div class="now-label">MTD</div><div class="now-val" style="color:${mtd>=0?'#60a5fa':'#f87171'}">${D.kpi.mtd}%</div><div class="now-sub" style="color:${moAbove?'#34d399':'#f87171'}">${moAbove?'Above':'Below'} 5yr ${pct(seasMo5)}<span style="font-size:9px;color:#6b7280"> · 20yr ${pct(seasMo)}</span></div></div>
    <div class="now-div"></div>
    <div class="now-metric"><div class="now-label">Wk ${TODAY_WK}</div><div class="now-val" style="color:${wkAbove?'#60a5fa':'#f87171'}">${pct(seasWk5)}<span style="font-size:10px;color:#6b7280"> 5yr</span></div><div class="now-sub" style="color:${wkAbove?'#34d399':'#f87171'}">20yr ${pct(seasWk)} · +ve ${D.seas.wkPos[TODAY_MO]}%</div></div>
    <div class="now-div"></div>
    <div class="pos-bar-wrap"><div class="pos-bar-label" style="color:#9ca3af;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px">YTD rank vs history</div>

  const seasMo=D.seas.avg[TODAY_MO],seasNext=D.seas.avg[(TODAY_MO+1)%12];

// ── Technical Indicator Dashboard ────────────────────────────────────────────
// Surgical fix: Technical tab only. Keeps old dashboard intact.
function techEsc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function techNum(v){const n=safeNum(v);return n===null?null:n;}
function techFmt(v,d){const n=techNum(v);return n===null?'--':fmtPrice(n,d);}
function techPct(v,d=1){const n=techNum(v);return n===null?'--':`${n>=0?'+':''}${n.toFixed(d)}%`;}
function techCls(v){const n=techNum(v);return n===null?'muted':n>=0?'pos':'neg';}
function techPerfField(tf){return tf==='weekly'?'r1m':(tf==='monthly'?'mtd':'ytd');}
function techPerfLabel(tf){return tf==='weekly'?'1M':(tf==='monthly'?'MTD':'YTD');}
function techNormStatus(s){
  const v=String(s||'').trim();
  if(!v)return '';
  const low=v.toLowerCase().replace(/_/g,' ');
  if(low.includes('below s2'))return 'Below S2';
  if(low.includes('below s1'))return 'Below S1';
  if(low.includes('below pivot')||low.includes('under pivot'))return 'Below Pivot';
  if(low.includes('above pivot')||low.includes('above'))return 'Above Pivot';
  if(low.includes('inside cpr'))return 'Inside CPR';
  return v;
}
function techStatusFromLevels(price,pivot,s1,s2){
  // Market-grade fallback only when real backend levels exist. Never infer from drawdown.
  if(price===null)return '';
  if(s2!==null && price<s2)return 'Below S2';
  if(s1!==null && price<s1)return 'Below S1';
  if(pivot!==null && price<pivot)return 'Below Pivot';
  if(pivot!==null && price>=pivot)return 'Above Pivot';
  return '';
}
function techStatusClass(status){
  const s=techNormStatus(status);
  if(s==='Below S2')return 'status-s2';
  if(s==='Below S1')return 'status-s1';
  if(s==='Below Pivot')return 'status-piv';
  if(s==='Inside CPR')return 'status-cpr';
  if(s==='Above Pivot')return 'status-ok';
  return 'status-missing';
}
function techStatusPill(status){
  const s=techNormStatus(status)||'Missing';
  return `<span class="status-pill ${techStatusClass(s)}">${techEsc(s)}</span>`;
}
function techCprClass(type){
  const t=String(type||'').toLowerCase().replace(/\s+/g,'_');
  if(t.includes('ultra'))return 'cpr-ultra_narrow';
  if(t.includes('narrow'))return 'cpr-narrow';
  if(t.includes('wide'))return 'cpr-wide';
  if(t)return 'cpr-normal';
  return 'cpr-missing';
}
function techCprPill(type){
  const t=String(type||'missing').replace(/_/g,' ');
  return `<span class="cpr-pill ${techCprClass(type)}">${techEsc(t)}</span>`;
}
function techArray(v){return Array.isArray(v)?v:[];}
function techPickRows(obj){
  if(!obj)return [];
  if(Array.isArray(obj))return obj;
  const priority=['all','rows','instruments','data','universe','items'];
  for(const k of priority){if(Array.isArray(obj[k])&&obj[k].length)return obj[k];}
  const buckets=['below_s2','belowS2','below_s1','belowS1','below_pivot','belowPivot','inside_cpr','insideCPR','above_pivot','abovePivot','narrow_cpr','narrowCPR','compression','cpr','opportunities'];
  let out=[];
  buckets.forEach(k=>{if(Array.isArray(obj[k]))out=out.concat(obj[k]);});
  return out;
}
function techRows(tf){
  if(!techSummary)return [];
  let raw=[];
  if(Array.isArray(techSummary))raw=techSummary;
  else if(techSummary[tf])raw=techPickRows(techSummary[tf]);
  if(!raw.length)raw=techPickRows(techSummary);
  if(!raw.length && techSummary.summary && Array.isArray(techSummary.summary[tf]))raw=techSummary.summary[tf];
  const seen=new Set();
  return raw.map(r=>techNormalizeRow(r,tf)).filter(r=>{
    const k=[r.ticker,r.group,r.label].join('|');
    if(seen.has(k))return false;
    seen.add(k);
    return true;
  });
}
function techFirst(...vals){for(const v of vals){if(v!==undefined&&v!==null&&v!=='')return v;}return null;}
function techNormalizeRow(r,tf){
  const lens=(r&&typeof r==='object'&&r[tf]&&typeof r[tf]==='object')?r[tf]:{};
  const x={...r,...lens};
  const price=techNum(techFirst(x.last_close,x.price,x.close,x.lastClose));
  const pivot=techNum(techFirst(x.pivot,x.p,x.central_pivot));
  const s1=techNum(techFirst(x.s1,x.support1));
  const s2=techNum(techFirst(x.s2,x.support2));
  const r1=techNum(techFirst(x.r1,x.resistance1));
  const r2=techNum(techFirst(x.r2,x.resistance2));
  const bc=techNum(techFirst(x.bc,x.cpr_bottom,x.bottom_cpr));
  const tc=techNum(techFirst(x.tc,x.cpr_top,x.top_cpr));
  const perfKey=techPerfField(tf);
  const selected=techNum(techFirst(x.selected_return,x[perfKey],x.return_selected,x.return_pct,x.performance));
  const ytd=techNum(techFirst(x.ytd,x.r_ytd,x.return_ytd));
  const dd=techNum(techFirst(x.current_drawdown,x.curdd,x.drawdown,x.current_dd));
  const cprWidth=techNum(techFirst(x.cpr_width_pct,x.cpr_width,x.cprPct));
  const status=techNormStatus(techFirst(x.pivot_status,x.status,x.price_position,x.position)) || techStatusFromLevels(price,pivot,s1,s2);
  let priceVs=techFirst(x.price_vs_cpr,x.cpr_position,x.priceVsCpr);
  if(!priceVs && price!==null && bc!==null && tc!==null){priceVs=price<bc?'Below CPR':price>tc?'Above CPR':'Inside CPR';}
  const cprType=techFirst(x.cpr_type,x.cpr,x.cpr_class,x.cprType);
  let weakness=techNum(techFirst(x.weakness_score,x.weakness_rank,x.opportunity_score));
  if(weakness===null){
    const statusScore=status==='Below S2'?4:status==='Below S1'?3:status==='Below Pivot'?2:status==='Inside CPR'?1:0;
    const ddScore=dd!==null?Math.min(4,Math.max(0,Math.abs(Math.min(dd,0))/6)):0;
    const retScore=selected!==null?Math.min(3,Math.max(0,-selected/3)):0;
    weakness=statusScore+ddScore+retScore;
  }
  return {
    raw:x,
    group:String(techFirst(x.group,x.region,x.asset_class,x.category,'Ungrouped')),
    label:String(techFirst(x.label,x.name,x.display_name,x.ticker,x.symbol,'Unknown')),
    ticker:String(techFirst(x.ticker,x.symbol,x.tk,'')),
    last_close:price, selected_return:selected, ytd, current_drawdown:dd,
    pivot,s1,s2,r1,r2,bc,tc,cpr_width_pct:cprWidth,cpr_type:cprType,price_vs_cpr:priceVs,status,weakness_rank:weakness,
    ma50:techNum(techFirst(x.ma50,x.sma50)), ma200:techNum(techFirst(x.ma200,x.sma200)),
    signal:techFirst(x.dip_zone,x.signal,x.action,x.trade_signal,null)
  };
}
function techSignal(r){
  if(r.signal)return String(r.signal);
  if(r.status==='Below S2')return 'Best / Deep Weakness';
  if(r.status==='Below S1')return 'Better Weakness';
  if(r.status==='Below Pivot')return 'Good Pullback';
  const pv=String(r.price_vs_cpr||'').toLowerCase();
  const ct=String(r.cpr_type||'').toLowerCase();
  if(pv.includes('inside')&&ct.includes('narrow'))return 'Compression Watch';
  if(r.status==='Above Pivot')return 'Healthy';
  return 'Neutral';
}
function techSortRows(rows,sortKey){
  const arr=[...rows];
  const num=(r,k)=>techNum(r[k]);
  arr.sort((a,b)=>{
    if(sortKey==='return')return (num(a,'selected_return')??-999)-(num(b,'selected_return')??-999);
    if(sortKey==='drawdown')return (num(a,'current_drawdown')??999)-(num(b,'current_drawdown')??999);
    if(sortKey==='cpr')return (num(a,'cpr_width_pct')??999)-(num(b,'cpr_width_pct')??999);
    if(sortKey==='ticker')return String(a.ticker).localeCompare(String(b.ticker));
    if(sortKey==='price')return (num(b,'last_close')??-1)-(num(a,'last_close')??-1);
    return (num(b,'weakness_rank')??0)-(num(a,'weakness_rank')??0);
  });
  return arr;
}

function techApplyFilters(rows){
  const q=(document.getElementById('techSearch')?.value||'').trim().toLowerCase();

  const stat=document.getElementById('techStatusFilter')?.value||'';
  const cpr=document.getElementById('techCprFilter')?.value||'';
  const sort=document.getElementById('techSortFilter')?.value||'weakness';
  let out=rows.filter(r=>{
    const hay=[r.ticker,r.label,r.group,r.status,r.cpr_type,r.price_vs_cpr].join(' ').toLowerCase();
    if(q && !hay.includes(q))return false;
    if(grp && r.group!==grp)return false;
    if(stat && r.status!==stat)return false;
    if(cpr && String(r.cpr_type||'').toLowerCase().replace(/\s+/g,'_')!==cpr)return false;
    return true;
  });
  return techSortRows(out,sort);
}

function techGroups(rows){
  const map={};
  rows.forEach(r=>{const g=r.group||'Ungrouped';(map[g]||(map[g]=[])).push(r);});
  return Object.entries(map).map(([group,rs])=>{
    const belowPivot=rs.filter(r=>['Below Pivot','Below S1','Below S2'].includes(r.status)).length;
    const belowS1=rs.filter(r=>['Below S1','Below S2'].includes(r.status)).length;
    const belowS2=rs.filter(r=>r.status==='Below S2').length;
    const avgDD=rs.reduce((s,r)=>s+(r.current_drawdown??0),0)/Math.max(1,rs.filter(r=>r.current_drawdown!==null).length);
    const avgRet=rs.reduce((s,r)=>s+(r.selected_return??0),0)/Math.max(1,rs.filter(r=>r.selected_return!==null).length);
    const sorted=techSortRows(rs,'weakness');
    const worst=sorted[0]?.ticker||'--';
    const best=[...rs].sort((a,b)=>(b.selected_return??-999)-(a.selected_return??-999))[0]?.ticker||'--';
    const score=rs.reduce((s,r)=>s+(r.weakness_rank??0),0)/Math.max(1,rs.length);
    return {group,count:rs.length,belowPivot,belowS1,belowS2,avgDD,avgRet,worst,best,score};
  }).sort((a,b)=>b.score-a.score);
}

}

function renderRotation(SD,el){
  const secs=SD.sectors.filter(s=>s.type!=='m'&&s.type!=='b');
  const bYtd=SD.bm.ytd;
  const cyc=secs.filter(s=>s.type==='c'||s.type==='h'),def=secs.filter(s=>s.type==='d');
  const cycAvg=parseFloat((cyc.reduce((a,s)=>a+s.ytd,0)/Math.max(cyc.length,1)).toFixed(1));
  const defAvg=parseFloat((def.reduce((a,s)=>a+s.ytd,0)/Math.max(def.length,1)).toFixed(1));
  const aboveBm=secs.filter(s=>s.ytd>bYtd).length;
  const sorted=[...secs].sort((a,b)=>b.ytd-a.ytd);
  const maxAbs=Math.max(...secs.map(s=>Math.abs(s.ytd-bYtd)),1);
  const cycleMap={
    US:[{phase:'Early Cycle',secs:'Financials · Disc · Industrials',key:'early'},{phase:'Mid Cycle',secs:'Tech · Semis · Materials',key:'mid'},{phase:'Late Cycle',secs:'Energy · Healthcare · Staples',key:'late'},{phase:'Recession',secs:'Utilities · Staples · Healthcare',key:'rec'}],
    INDIA:[{phase:'Early Cycle',secs:'PSU Bank · Infra · Auto',key:'early'},{phase:'Mid Cycle',secs:'Metal · IT · Pvt Bank',key:'mid'},{phase:'Late Cycle',secs:'Energy · Oil & Gas · FMCG',key:'late'},{phase:'Recession',secs:'Pharma · Health · FMCG',key:'rec'}],
    TSX:[{phase:'Early Cycle',secs:'Financials · Industrials · Disc',key:'early'},{phase:'Mid Cycle',secs:'Materials · Technology · Energy',key:'mid'},{phase:'Late Cycle',secs:'Energy · Gold · Healthcare',key:'late'},{phase:'Recession',secs:'Utilities · Staples · Telecom',key:'rec'}]
  };
  const cycles=cycleMap[curSctry]||cycleMap.US;
  const breadthPct=Math.round(aboveBm/secs.length*100);
  const cycLead=cycAvg>defAvg;
  const bothPos=cycAvg>0&&defAvg>0,bothNeg=cycAvg<0&&defAvg<0;
  const computedPhase=bothNeg?'Recession':(!cycLead&&defAvg>0&&defAvg>cycAvg+1)?'Late Cycle':(cycLead&&bothPos&&breadthPct>55)?'Mid Cycle':'Early/Mixed';
  const ap=computedPhase.toLowerCase();
  const bestSec=secs.reduce((a,b)=>b.ytd>a.ytd?b:a);
  const worstSec=secs.reduce((a,b)=>b.ytd<a.ytd?b:a);
  const leadType=cycLead?'Cyclicals leading':'Defensives leading';
  const breadthSignal=breadthPct>60?'broad participation':'narrow breadth';
  const computedNote=`${leadType} — cyclicals avg <b>${pct(cycAvg)}</b> vs defensives <b>${pct(defAvg)}</b>. `+
    `<b>${aboveBm}/${secs.length}</b> sectors above ${SD.bm.label} benchmark (${breadthSignal}). `+
    `Top: <b>${bestSec.name} ${pct(bestSec.ytd)}</b> · Laggard: <b>${worstSec.name} ${pct(worstSec.ytd)}</b>.`;
  el.innerHTML=`
  <div class="verdict-card" style="margin-bottom:10px">
    <div class="verdict-label">Rotation intelligence — ${SD.label} · computed phase: ${computedPhase}</div>
    <div class="verdict-text">${computedNote}</div>
  </div>
  <div class="g2" style="margin-bottom:10px">
    <div class="pnl">
      <div class="ptl">Cycle clock — current phase</div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <div style="flex:1;background:#f9fafb;border-radius:6px;padding:7px;text-align:center">
          <div style="font-size:9px;color:#9ca3af;font-weight:700;text-transform:uppercase;margin-bottom:2px">Cyclicals avg</div>
          <div style="font-size:20px;font-weight:800;font-family:'Courier New',monospace;color:${cycAvg>=0?'#16a34a':'#dc2626'}">${pct(cycAvg)}</div>
        </div>
        <div style="flex:1;background:#f9fafb;border-radius:6px;padding:7px;text-align:center">
          <div style="font-size:9px;color:#9ca3af;font-weight:700;text-transform:uppercase;margin-bottom:2px">Defensives avg</div>
          <div style="font-size:20px;font-weight:800;font-family:'Courier New',monospace;color:${defAvg>=0?'#16a34a':'#dc2626'}">${pct(defAvg)}</div>
        </div>
      </div>
      <div style="font-size:9px;color:#9ca3af;font-weight:700;text-transform:uppercase;margin-bottom:3px">Breadth vs ${SD.bm.label}</div>
      <div class="breadth-bar"><div class="breadth-fill" style="width:${aboveBm/secs.length*100}%"></div></div>
      <div style="font-size:10px;color:#374151;margin-bottom:8px"><b>${aboveBm} of ${secs.length}</b> sectors above benchmark</div>
      <div class="cycle-grid">
        ${cycles.map(c=>{const isActive=ap.includes(c.key)||SD.phase===c.phase;return`<div class="phase-card ${isActive?'active':''}"><div class="phase-nm ${isActive?'on':''}">${c.phase}${isActive?' ←':''}</div><div class="phase-ss ${isActive?'on':''}">${c.secs}</div></div>`;}).join('')}
      </div>
    </div>
    <div class="pnl">
      <div class="ptl">Relative strength vs ${SD.bm.label} YTD</div>
      ${sorted.map(s=>{
        const rel=parseFloat((s.ytd-bYtd).toFixed(1));
        const w=Math.round(Math.abs(rel)/maxAbs*45);
        return`<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">

// ── loadLiveData ──────────────────────────────────────────────────────────────
async function loadLiveData(){
  const base=window.location.pathname.replace(/\/[^\/]*$/,'')+'/data/';
  try{
    const meta=await fetch(base+'metadata.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);
    if(meta&&meta.generated_at){
      const d=new Date(meta.generated_at);
      const fmt=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})
               +' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' UTC';
      document.getElementById('updTs').textContent=fmt+' · live';
    }
  }catch(e){}

  try{
    techSummary=await fetch(base+'technical_summary.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);
  }catch(e){techSummary=null;}

  const jobs=[];
  Object.entries(MKTS_TK).forEach(([file,key])=>{jobs.push({file,type:'mkt',key});});
  ['US','INDIA','TSX'].forEach(ctry=>{
    SECTS[ctry].sectors.forEach((s,idx)=>{
      jobs.push({file:'returns_'+safeTk(s.tk),type:'sect',ctry,idx});
    });
  });

  const BATCH=8;
  let updated=0,failed=0;
  for(let i=0;i<jobs.length;i+=BATCH){
    const batch=jobs.slice(i,i+BATCH);
    await Promise.allSettled(batch.map(async job=>{
      try{
        const r=await fetch(base+job.file+'.json',{cache:'no-store'});
        if(!r.ok)throw new Error(r.status);
        const d=await r.json();
        if(job.type==='mkt'){
          const M=MKTS[job.key];
          if(d.kpi)     M.kpi=d.kpi;
          if(d.annual)  M.annual=d.annual;
          if(d.monthly) M.monthly=d.monthly;
          if(d.seas)    M.seas=d.seas;
          // ── price layer merge: supports top-level fields and kpi.* fields ──
          mergePriceLayer(M,d);
        } else {
          const s=SECTS[job.ctry].sectors[job.idx];
          if(d.kpi){
            s.ytd  =safeNum(d.kpi.ytd)  ??s.ytd;
            s.mtd   = safeNum(d.kpi.mtd)   ?? (s.mtd || 0);
            s.r1m  =safeNum(d.kpi.r1m)  ??s.r1m;
            s.r3m  =safeNum(d.kpi.r3m)  ??s.r3m;
            s.r6m   = safeNum(d.kpi.r6m)   ?? (s.r6m || 0);
            s.r1y  =safeNum(d.kpi.r1y)  ??s.r1y;
            s.maxdd=safeNum(d.kpi.maxdd) ??s.maxdd;
            s.curdd = safeNum(d.kpi.curdd) ?? (s.curdd || 0);
          }
          if(d.annual)  s.annual=d.annual;
          if(d.monthly) s.monthly=d.monthly;
          if(d.seas)    s.seas=d.seas;
          // ── price layer merge: supports top-level fields and kpi.* fields ──
          mergePriceLayer(s,d);
        }
        updated++;
      }catch(e){failed++;}
    }));
  }

  // Sync benchmark YTD from live MKTS into SECTS
  if(MKTS.SP    &&MKTS.SP.kpi)    SECTS.US.bm.ytd   =safeNum(MKTS.SP.kpi.ytd)   ??SECTS.US.bm.ytd;
  if(MKTS.NIFTY &&MKTS.NIFTY.kpi) SECTS.INDIA.bm.ytd=safeNum(MKTS.NIFTY.kpi.ytd)??SECTS.INDIA.bm.ytd;
  if(MKTS.TSX   &&MKTS.TSX.kpi)   SECTS.TSX.bm.ytd  =safeNum(MKTS.TSX.kpi.ytd)  ??SECTS.TSX.bm.ytd;

  if(updated>0){
    killCharts();
    buildMktStrip();
    renderAll();
    console.log('MarketPulse: live data loaded ('+updated+' ok, '+failed+' failed)');
  } else {
    document.getElementById('updTs').textContent='Embedded data (live fetch failed)';
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
buildMktStrip();
renderAll();
setTimeout(loadLiveData,200);
</script>
</body>
</html>
